# nuva-edu — compose principal.
# Cada sistema tem o seu docker-compose.yml na própria pasta; este arquivo só os inclui.
#
# Uso (os segredos ficam em .env.local, fora do Git):
#   pnpm dev:up            ambiente local, com os perfis traefik e mailpit
#   pnpm compose <args>    docker compose --env-file .env --env-file .env.local <args>
#
# Perfis:
#   traefik  proxy reverso próprio (desligue onde já existe um Traefik e aponte TRAEFIK_NETWORK para a rede dele)
#   mailpit  captura de e-mail para desenvolvimento

name: nuva-edu

include:
  - path: database/postgres/docker-compose.yml
  - path: proxy/traefik/docker-compose.yml
  - path: mail/mailpit/docker-compose.yml
  - path: apps/admin-api/docker-compose.yml
  - path: apps/classroom-api/docker-compose.yml
  - path: apps/worker/docker-compose.yml
  - path: apps/admin/docker-compose.yml
  - path: apps/classroom/docker-compose.yml

networks:
  # Rede interna: banco e comunicação entre serviços. Sem saída publicada.
  internal:
    name: nuva-edu-internal
  # Rede do proxy: só os serviços com rótulos do Traefik entram nela.
  public:
    name: ${TRAEFIK_NETWORK:-nuva-edu-proxy}
    external: ${TRAEFIK_NETWORK_EXTERNAL:-false}
