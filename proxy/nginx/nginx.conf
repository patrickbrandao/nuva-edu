# Nginx dos sites estáticos (admin e classroom). Copiado para as duas imagens.
# Roda sem privilégios, na porta 8080, com a raiz somente leitura: tudo o que é gravado
# fica em /tmp e /run (tmpfs).

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # O acesso já é registrado pelas APIs; aqui só saem erros.
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Gerado na subida do contêiner (docker-entrypoint.d/40-nuva-config.sh), nunca no build.
    location = /config.json {
      alias /run/nuva/config.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Arquivos com hash no nome: cache longo. Arquivo que não existe é 404, não a SPA.
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Caminhos das APIs e das sondas nunca são do site. O proxy entrega /api, /mcp e /healthz
    # às APIs; /readyz e /metrics não saem da rede interna (spec 031). Se algum chegar aqui,
    # a resposta é 404, não o index.html.
    location /api/ { return 404; }
    location /mcp { return 404; }
    location = /healthz { return 404; }
    location = /readyz { return 404; }
    location = /metrics { return 404; }

    # SPA: qualquer outra rota cai no index.html, que nunca fica em cache.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
