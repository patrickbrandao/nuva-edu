# lighttpd dos sites estáticos (admin e classroom). Copiado para as duas imagens.
# Roda sem privilégios (o `USER` do Dockerfile; aqui não há `server.username`), na porta 8080,
# com a raiz somente leitura: só se grava em tmpfs. O script de entrada gera o
# /run/nuva/config.json; o lighttpd usa o /tmp para os temporários e para o cache da compressão.
# Sem `server.pid-file`.
#
# Conferir a sintaxe: lighttpd -tt -f /etc/lighttpd/lighttpd.conf

# Só o que os sites usam. `mod_rewrite` e `mod_setenv` são embutidos no binário;
# `mod_deflate` vem no próprio pacote `lighttpd` do Alpine.
server.modules = ( "mod_rewrite", "mod_setenv", "mod_deflate" )

server.document-root = "/srv/nuva/site"
server.port = 8080
# Sem versão no cabeçalho `Server` nem nas páginas de erro.
server.tag = "lighttpd"
# O proxy fala HTTP/1.1 com os sites; o HTTP/2 fica desligado (e o mod_h2, sem carregar).
server.feature-flags = ( "server.h2proto" => "disable", "server.h2c" => "disable" )
# O /config.json da raiz é um atalho para /run/nuva/config.json (tmpfs).
server.follow-symlink = "enable"

# Erros vão para a saída de erro do contêiner (o padrão sem `server.errorlog`). O acesso já é
# registrado pelas APIs e pelo proxy: o mod_accesslog não é carregado.

# Temporários de resposta grande (o padrão, /var/tmp, é somente leitura no contêiner).
server.upload-dirs = ( "/tmp" )

# Sem listagem de pasta: o mod_dirlisting não é carregado.
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html",
  ".js" => "text/javascript",
  ".mjs" => "text/javascript",
  ".css" => "text/css",
  ".json" => "application/json",
  ".map" => "application/json",
  ".webmanifest" => "application/manifest+json",
  ".svg" => "image/svg+xml",
  ".png" => "image/png",
  ".jpg" => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif" => "image/gif",
  ".webp" => "image/webp",
  ".avif" => "image/avif",
  ".ico" => "image/x-icon",
  ".woff2" => "font/woff2",
  ".woff" => "font/woff",
  ".ttf" => "font/ttf",
  ".otf" => "font/otf",
  ".txt" => "text/plain",
  ".xml" => "text/xml",
  ".pdf" => "application/pdf",
  ".wasm" => "application/wasm",
  ".mp4" => "video/mp4",
  ".webm" => "video/webm",
  ".mp3" => "audio/mpeg",
  "" => "application/octet-stream"
)

# Compressão só em gzip. O resultado fica em cache no tmpfs (os arquivos do site não mudam
# enquanto o contêiner vive); a pasta é criada na subida pelo próprio lighttpd.
deflate.cache-dir = "/tmp/lighttpd-deflate"
deflate.allowed-encodings = ( "gzip" )
deflate.mimetypes = (
  "text/html",
  "text/css",
  "text/plain",
  "text/javascript",
  "application/json",
  "image/svg+xml"
)
deflate.min-compress-size = 1024

# SPA: o que não é arquivo cai no index.html. A lista é conferida na ordem e o destino vazio
# quer dizer "não regrave", ou seja, 404 de verdade:
#   - /api/, /mcp, /healthz, /readyz e /metrics nunca são do site. O proxy entrega /api, /mcp e
#     /healthz às APIs; /readyz e /metrics não saem da rede interna (spec 031);
#   - arquivo de /assets/ que não existe é 404, não a SPA.
# A expressão é comparada com o caminho seguido da query string.
# A própria pasta /assets/ também é 404 (sem índice, o lighttpd responderia 403).
url.rewrite-once = ( "^/assets/(?:\?|$)" => "/assets/.nao-existe" )
url.rewrite-if-not-file = (
  "^/(?:api/|mcp|assets/)" => "",
  "^/(?:healthz|readyz|metrics)(?:\?|$)" => "",
  "" => "/index.html"
)

# Content-Security-Policy sem `unsafe-inline` (spec 033). O arquivo define `var.nuva_csp` e é
# gerado no build da imagem por proxy/lighttpd/csp.mjs, com o hash do script inline do tema que
# está no index.html. Nenhuma política é escrita à mão aqui.
include "/etc/lighttpd/nuva-csp.conf"

# Cabeçalhos por caminho. Depois da regravação da SPA, o caminho conferido é /index.html.
$HTTP["url"] == "/config.json" {
  # Gerado na subida do contêiner (proxy/lighttpd/entrypoint.sh), nunca no build.
  setenv.set-response-header = (
    "Cache-Control" => "no-store",
    "X-Content-Type-Options" => "nosniff"
  )
}
else $HTTP["url"] =~ "^/assets/" {
  # Arquivos com hash no nome: cache longo.
  setenv.set-response-header = (
    "Cache-Control" => "public, max-age=31536000, immutable",
    "X-Content-Type-Options" => "nosniff"
  )
}
else $HTTP["url"] =~ "^/(?:api/|mcp|(?:healthz|readyz|metrics)$)" {
  # 404 das APIs e das sondas: sem cabeçalho do site.
}
else {
  # O index.html (e o que mais houver na raiz) nunca fica em cache.
  setenv.set-response-header = (
    "Cache-Control" => "no-cache",
    "X-Content-Type-Options" => "nosniff",
    "Referrer-Policy" => "strict-origin-when-cross-origin",
    "Content-Security-Policy" => var.nuva_csp
  )
}
