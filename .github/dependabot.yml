# Dependabot semanal para npm, Docker e GitHub Actions (spec 032, "CI").
# Os PRs passam pelo fluxo `verify` como qualquer contribuição externa.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      correcoes:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /apps/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker-compose
    directories:
      - /database/postgres
      - /proxy/traefik
      - /mail/mailpit
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(deps)

  # As ações são fixadas por SHA; o Dependabot atualiza o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(deps)
    groups:
      acoes:
        patterns:
          - "*"
