    post:
      operationId: grantEntitlement
      tags: [entitlements]
      summary: Conceder acesso manual
      x-permission: entitlement.manage
      description: |
        Cria a raiz `grant` com a cascata do produto, numa transação, grava a auditoria e envia o e-mail
        `access.granted`. Idempotente: a mesma concessão (usuário, quem concede, produto) ainda ativa
        responde `200` com o direito existente. Produto inexistente: `404`. `expiresAt` no passado:
        `422` `expires_at_in_past`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productType, productId, reason]
              properties:
                productType:
                  $ref: "#/components/schemas/ProductType"
                productId:
                  $ref: "#/components/schemas/Uuid"
                expiresAt:
                  oneOf:
                    - $ref: "#/components/schemas/DateTime"
                    - type: "null"
                  description: Fim do acesso; `null` ou ausente é vitalício.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Motivo, obrigatório; vai para a auditoria.
