              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumModerationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users/{id}/unsuspend:
    post:
      operationId: unsuspendUser
      tags:
        - moderation
      summary: Encerrar a suspensão vigente com motivo
      description: Reutiliza o fluxo de reativação e grava o motivo no histórico de moderação.
      x-permission: users.suspend
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumModerationReason"
      responses:
        "200":
          description: Operação concluída.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuva_admin_session
      description: |
        Identificador opaco da sessão (`specs/007-contas-e-autenticacao.md`). Vale só neste site.
    # --- comum ---
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Token CSRF da sessão, devolvido em `GET /api/v1/session`. Exigido, junto com
        `sessionCookie`, em toda operação que altera dados:

        ```yaml
        security:
          - sessionCookie: []
            csrfToken: []
        ```

        Os dois na mesma entrada da lista, porque ambos são exigidos. Cabeçalho ausente ou
        diferente do token da sessão: `403` com `code: csrf_token_invalid`. Não existe parâmetro
        de cabeçalho para ele; o cliente gerado o preenche sozinho nas requisições que não são
        `GET`, `HEAD`, `OPTIONS` ou `TRACE`.
  parameters:
    # --- comum ---
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` da página anterior. Ausente na primeira página.
      schema:
        $ref: "#/components/schemas/Cursor"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Chave escolhida pelo cliente; a repetição devolve a primeira resposta por 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        $ref: "#/components/schemas/Uuid"
    EbookTargetTypePath:
      name: targetType
      in: path
      required: true
      description: "Tipo do alvo do vínculo: `course` ou `lesson` (`bundle` e outros: `400`)."
      schema:
        type: string
        enum: [course, lesson]
    EbookTargetIdPath:
      name: targetId
      in: path
      required: true
      description: Identificador do curso ou da aula.
      schema:
        $ref: "#/components/schemas/Uuid"
    AuthProviderPath:
      name: provider
      in: path
      required: true
      description: |
        Provedor de login social. Provedor sem as variáveis configuradas nesta instalação (fora de
        `authProviders` em `GET /api/v1/meta`) responde `404`.
      schema:
        $ref: "#/components/schemas/AuthProvider"
    ReturnTo:
      name: returnTo
      in: query
      description: |
        Caminho do próprio site para onde o navegador volta depois do login (começa com `/`, não
        com `//`). Outro valor, ou ausente, vira `/`; nunca é recusado.
      schema:
        type: string
        maxLength: 2048
    ImageIdPath:
      name: imageId
      in: path
      required: true
      description: Identificador da imagem.
      schema:
        $ref: "#/components/schemas/Uuid"
    ImageVariantPath:
      name: variant
      in: path
      required: true
      description: |
        Largura da variante, em pixels. Cada imagem só tem as variantes da sua finalidade
        (`specs/029-imagens.md`, "Finalidades e variantes"); outra largura responde `404`.
      schema:
        $ref: "#/components/schemas/ImageVariantWidth"
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        `ETag` de uma entrega anterior. Igual ao atual, a resposta é `304`, sem corpo.
      schema:
        type: string
    # --- Fase 4: notificações, stream e operação ---
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        Último `id` recebido antes da queda (`specs/004-classroom-api.md`, "Fluxo SSE"): o fluxo
        reenvia os eventos daquele usuário com `id` maior. Ausente na primeira conexão.
      schema:
        $ref: "#/components/schemas/StreamEventId"
    NotificationLimit:
      name: limit
      in: query
      description: Itens por página da central (padrão 20, máximo 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    SlugPath:
      name: slug
      in: path
      required: true
      description: Identificador legível do produto na URL (único por tipo de produto).
      schema:
        $ref: "#/components/schemas/Slug"
  headers:
    # --- comum ---
    XRequestId:
      description: Identificador da requisição, o mesmo que aparece nos logs.
      schema:
        type: string
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Endereço para onde o navegador é redirecionado.
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: |
        Grava ou apaga um cookie do site: o da sessão ou o de retorno do login social
        (`specs/007-contas-e-autenticacao.md`, "Cookies"). Os dois são `HttpOnly`: o site não os
        lê; o navegador os guarda e reenvia sozinho.
      schema:
        type: string
    NoStore:
      description: Sempre `no-store`; a resposta não é guardada em cache.
      schema:
        type: string
        const: no-store
    ETag:
      description: Hash do conteúdo da variante; muda quando o conteúdo muda.
      schema:
        type: string
    ImageCacheControl:
      description: |
        Sempre `public, max-age=31536000, immutable`: a URL de uma imagem nunca muda de conteúdo.
      schema:
        type: string
        const: public, max-age=31536000, immutable
    ContentTypeOptions:
      description: Sempre `nosniff`.
      schema:
        type: string
        const: nosniff
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    ContentDisposition:
      description: Sempre `attachment`, com o nome sugerido do arquivo (`filename`).
      schema:
        type: string
  responses:
    # --- comum ---
    BadRequest:
      description: |
        Requisição fora do contrato (`validation_failed`); `errors` lista os campos. Vale também
        para operação sem parâmetros: cabeçalho ou URL malformados são recusados antes da rota.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Sem sessão válida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Sem permissão para a operação (`permission_denied`), escrita sem `X-CSRF-Token` válido
        (`csrf_token_invalid`) ou outra recusa de acesso com `code` próprio.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente ou fora do alcance de quem pede.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado, com `code` próprio (por exemplo, `version_conflict`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: |
        Corpo acima do limite da rota (`payload_too_large`): 1 MB, ou 5 MB no envio de imagem.
        A rota não roda.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: |
        `Content-Type` que a operação não declara em `requestBody.content`, ou que o serviço não
        sabe ler (`unsupported_media_type`). A rota não roda.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Regra de negócio impede a operação; o `code` é o da regra.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Limite de taxa atingido (`rate_limited`); `retryAfterSeconds` repete o `Retry-After`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Erro inesperado (`internal_error`), sem `detail`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência indisponível (banco ou provedor externo).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: |
        Limite de taxa (`rate_limited`) ou bloqueio por tentativas erradas de senha, da conta ou
        do IP (`too_many_attempts`; `specs/007-contas-e-autenticacao.md`, "Bloqueio e dispositivo
        novo"). `Retry-After` e `retryAfterSeconds` trazem os segundos até poder tentar de novo.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ImageVariant:
      description: A variante, em WebP.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/ImageCacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        image/webp:
          schema:
            type: string
            contentMediaType: image/webp
    ImageNotModified:
      description: O `If-None-Match` é igual ao `ETag` atual; sem corpo.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/ImageCacheControl"
    # --- só admin-api ---
    OAuthReturn:
      description: |
        Volta ao próprio site (`Location`), conforme a tabela da descrição da operação. Abre a
        sessão (`Set-Cookie` de `nuva_admin_session`) quando entrou, e apaga o cookie de retorno
        (`nuva_admin_oauth`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Location:
          $ref: "#/components/headers/Location"
        Set-Cookie:
          $ref: "#/components/headers/SetCookie"
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    Pdf:
      description: |
        O arquivo PDF. `Content-Disposition` sugere o nome do arquivo; a resposta não é guardada em
        cache.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Disposition:
          $ref: "#/components/headers/ContentDisposition"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/pdf:
          schema:
            type: string
            contentMediaType: application/pdf
    # --- só admin-api: Fase 2 ---
    CertificateTemplateInvalid:
      description: |
        Template fora das regras (`certificate_template_invalid`, com `details.problems`) ou outra regra
        de negócio com `code` próprio.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CertificateTemplateInvalidProblem"
    SalesCsv:
      description: |
        As vendas em CSV, uma linha por item de pedido (`specs/011-vendas-e-checkout.md`,
        "Consulta e exportação"), em fluxo contínuo: a resposta começa antes de ler todos os
        pedidos e não é guardada em memória. UTF-8 com BOM, separador `;`, CRLF, decimais com
        vírgula; o nome sugerido do arquivo é `vendas-AAAA-MM-DD.csv`. O conteúdo e os filtros não
        vão para logs.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Disposition:
          $ref: "#/components/headers/ContentDisposition"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        text/csv:
          schema:
            type: string
            contentMediaType: text/csv
            description: |
              Cabeçalho `order_id;order_number;created_at;paid_at;status;buyer_name;buyer_email;tax_id_type;tax_id;product_type;product_title;unit_price;discount;paid_amount;refunded_amount;coupon_code;payment_method;provider;provider_payment_id`,
              seguido de uma linha por item de pedido.

  schemas:
    # --- comum ---
    Uuid:
      type: string
      format: uuid
      description: Identificador de recurso.
      examples: [0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70]
    DateTime:
      type: string
      format: date-time
      description: Instante em ISO 8601, sempre em UTC (sufixo `Z`).
      examples: ["2026-11-24T13:45:00Z"]
    Date:
      type: string
      format: date
      description: Data de calendário em ISO 8601, sem hora.
      examples: ["2026-11-24"]
    Cursor:
      type: string
      minLength: 1
      description: Cursor opaco de paginação; o cliente só o devolve como recebeu.
    MoneyCents:
      type: integer
      description: Valor em centavos inteiros, na moeda da instalação.
      examples: [19900]
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Moeda da instalação em ISO 4217 (`NUVA_CURRENCY`).
      examples: [BRL]
    Locale:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      description: Idioma em BCP 47 (`NUVA_LOCALE`).
      examples: [pt-BR]
    Page:
      type: object
      description: |
        Parte comum da resposta de listagem paginada por cursor. Traz só `nextCursor`: cada
        listagem a compõe com `allOf` e declara `items`, obrigatório, no próprio membro, com o
        esquema dos itens:

        ```yaml
        UserPage:
          allOf:
            - $ref: "#/components/schemas/Page"
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
        ```

        `items` não é declarado aqui porque a interseção de um `items` genérico com o da
        listagem tiparia o cliente gerado como `unknown[] & User[]`. Nem este esquema nem o
        membro da listagem usam `additionalProperties: false`, que invalidaria a composição.
      required: [nextCursor]
      properties:
        nextCursor:
          description: Cursor da próxima página; `null` na última.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
    ProblemFieldError:
      type: object
      description: Um campo recusado na validação.
      required: [path, message]
      properties:
        path:
          type: string
          description: Caminho do campo na requisição.
          examples: [body.email]
        message:
          type: string
    Problem:
      type: object
      description: |
        Erro no formato RFC 9457. Pode trazer campos extras conforme o `code`; os comuns estão
        declarados aqui (`errors`, `retryAfterSeconds`).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifica o tipo do problema; `about:blank` quando não há página própria.
          default: about:blank
        title:
          type: string
          description: Resumo curto, igual para todas as ocorrências do tipo.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: O mesmo código de status da resposta HTTP.
        detail:
          type: string
          description: Explicação desta ocorrência.
        instance:
          type: string
          format: uri-reference
          description: Caminho da requisição que falhou.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Identificador estável do erro, para o cliente decidir o que fazer. A lista é aberta:
            um `code` só muda ou some com mudança de versão da API, e código novo pode surgir.

            Códigos gerais, iguais nas duas APIs (`specs/003-admin-api.md`):

            | `code` | Status | Quando |
            | --- | --- | --- |
            | `validation_failed` | 400 | Requisição fora do contrato; `errors` lista os campos |
            | `unauthenticated` | 401 | Sem sessão válida |
            | `permission_denied` | 403 | Sessão válida, sem permissão para a operação |
            | `csrf_token_invalid` | 403 | Escrita sem `X-CSRF-Token` ou com token diferente do da sessão |
            | `not_found` | 404 | Recurso inexistente ou fora do alcance de quem pede |
            | `version_conflict` | 409 | `version` enviada diferente da gravada |
            | `payload_too_large` | 413 | Corpo acima do limite da rota |
            | `unsupported_media_type` | 415 | `Content-Type` que a operação não declara, ou que o serviço não sabe ler |
            | `rate_limited` | 429 | Limite de taxa; traz `retryAfterSeconds` |
            | `internal_error` | 500 | Erro inesperado; sem `detail` |
            | `database_unavailable` | 503 | Banco indisponível |
            | `payment_provider_unavailable` | 503 | Provedor de pagamento indisponível |

            Os demais `403`, `409`, `422` e `503` usam um código próprio da regra, definido na
            spec do recurso e citado na descrição da operação (por exemplo, `entitlement_required`).
          examples: [permission_denied, validation_failed, database_unavailable]
        errors:
          type: array
          description: Presente em erro de validação (`400`).
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: |
            Segundos até poder tentar de novo; o mesmo valor do cabeçalho `Retry-After`.
            Presente em `rate_limited` (`429`).
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    ReadinessCheck:
      type: string
      enum: [ok, fail]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, migrations]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Conexão com o PostgreSQL.
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Banco na versão de migration esperada pelo serviço.
          additionalProperties: false
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, facebook, apple]
      description: Provedor de login social.
    Meta:
      type: object
      description: |
        Dados públicos da instalação e da marca da escola (`specs/003-admin-api.md`, "Meta").
        Todos os campos estão sempre presentes; `logoUrl` e `accentColor` podem ser `null`.
      required:
        - schoolName
        - version
        - currency
        - locale
        - authProviders
        - logoUrl
        - accentColor
        - sourceCodeUrl
      properties:
        schoolName:
          type: string
          description: Nome da escola, definido na configuração do admin; padrão `nuva-edu`.
        version:
          type: string
          description: Versão instalada do nuva-edu (SemVer).
          examples: [0.1.0]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        locale:
          $ref: "#/components/schemas/Locale"
        authProviders:
          type: array
          description: |
            Provedores de login social configurados nesta instalação; vazio quando nenhum.
            Login por e-mail e senha está sempre disponível e não aparece na lista.
          items:
            $ref: "#/components/schemas/AuthProvider"
          uniqueItems: true
        logoUrl:
          type: [string, "null"]
          format: uri-reference
          description: |
            Caminho do logotipo na própria API, na variante de 256 px
            (`specs/029-imagens.md`). `null` sem logotipo: os sites mostram só o nome.
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/256.webp, null]
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: |
            Cor de destaque da escola, em `#RRGGBB`. `null` usa a cor de destaque padrão de
            `packages/ui`.
          examples: ["#1F6FEB", null]
        sourceCodeUrl:
          type: string
          format: uri
          description: |
            Endereço do código-fonte desta instalação, exigido pela AGPL-3.0. Sempre presente;
            padrão `https://github.com/patrickbrandao/nuva-edu`.
          examples: [https://github.com/patrickbrandao/nuva-edu]
      additionalProperties: false
    Email:
      type: string
      format: email
      maxLength: 254
      description: |
        Endereço de e-mail. A API o normaliza (minúsculas) antes de gravar ou comparar.
      examples: [ana@example.com]
    UserRole:
      type: string
      enum: [student, instructor, manager, admin]
      description: Papel do usuário (`specs/008-papeis-e-permissoes.md`).
    PermissionAction:
      type: string
      pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)*$"
      description: |
        Identificador de uma ação da matriz de permissões (`specs/008-papeis-e-permissoes.md`,
        "Identificadores das ações"), o mesmo de `x-permission`. A lista é aberta: ação nova
        entra pela spec 008.
      examples: [users.list, account.self_service]
    SessionSite:
      type: string
      enum: [classroom, admin]
      description: Site em que a sessão foi aberta.
    SessionUser:
      type: object
      description: Dono da sessão. Não tem campo de senha; `hasPassword` só diz se há uma definida.
      required: [id, name, email, emailVerified, role, avatarUrl, hasPassword]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          description: Nome de exibição.
        email:
          $ref: "#/components/schemas/Email"
        emailVerified:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: |
            Caminho da variante de 256 px do avatar na própria API; `null` sem avatar (o site
            mostra as iniciais do nome).
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/256.webp, null]
        hasPassword:
          type: boolean
          description: Verdadeiro quando a conta tem senha definida.
      additionalProperties: false
    SessionInfo:
      type: object
      description: Uma sessão aberta, nos dois sites.
      required: [id, site, ip, browser, os, createdAt, lastUsedAt, current]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: Identificador público da sessão (não é o valor do cookie).
        site:
          $ref: "#/components/schemas/SessionSite"
        ip:
          type: [string, "null"]
          description: IP de onde a sessão foi aberta.
          examples: [203.0.113.10]
        browser:
          type: [string, "null"]
          description: Família do navegador, lida do `User-Agent`; `null` quando não reconhecida.
          examples: [Chrome]
        os:
          type: [string, "null"]
          description: Sistema, lido do `User-Agent`; `null` quando não reconhecido.
          examples: [macOS]
        createdAt:
          $ref: "#/components/schemas/DateTime"
        lastUsedAt:
          $ref: "#/components/schemas/DateTime"
        current:
          type: boolean
          description: Verdadeiro na sessão que fez a requisição.
      additionalProperties: false
    SessionInfoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Mais recente primeiro (`lastUsedAt`).
          items:
            $ref: "#/components/schemas/SessionInfo"
      additionalProperties: false
    Identity:
      type: object
      description: Provedor de login social vinculado à conta.
      required: [provider, email, createdAt]
      properties:
        provider:
          $ref: "#/components/schemas/AuthProvider"
        email:
          type: [string, "null"]
          description: E-mail informado pelo provedor; `null` quando ele não enviou.
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    TermsDocument:
      type: string
      enum: [terms, privacy]
      description: Documento legal (`specs/030-lgpd.md`), Termos de Uso ou Política de Privacidade.
    ImageVariantWidth:
      type: integer
      enum: [64, 256, 480, 512, 1280, 1600]
      description: |
        Nome da variante na URL (`specs/029-imagens.md`): a largura do arquivo gerado nas
        finalidades com corte e o maior lado nas de proporção original.
    # --- só admin-api: contas, auditoria e termos ---
    Session:
      type: object
      description: Sessão do site admin (`specs/007-contas-e-autenticacao.md`, "Esquemas comuns").
      required: [user, csrfToken, permissions, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrfToken:
          type: string
          description: Valor do cabeçalho `X-CSRF-Token` nas escritas desta sessão.
        permissions:
          type: array
          description: |
            Ações de `specs/008-papeis-e-permissoes.md` que o papel permite; o site monta o menu
            com elas. Ação permitida só em parte (◐) também vem na lista.
          items:
            $ref: "#/components/schemas/PermissionAction"
          uniqueItems: true
        expiresAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    UserStatus:
      type: string
      enum: [active, suspended]
      description: "`suspended` quando há suspensão vigente, de qualquer tipo."
    UserSummary:
      type: object
      description: Um usuário na lista. Sem campo de senha.
      required:
        - id
        - name
        - email
        - emailVerified
        - role
        - avatarUrl
        - status
        - createdAt
        - lastLoginAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        emailVerified:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: Variante de 256 px do avatar; `null` sem avatar.
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        lastLoginAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Último login; `null` se nunca entrou.
      additionalProperties: false
    UserSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
    SuspensionKind:
      type: string
      enum: [posting, full]
      description: |
        `posting` impede publicar; `full` encerra as sessões e recusa o login
        (`specs/008-papeis-e-permissoes.md`, "Suspensão").
    UserRef:
      type: object
      description: Um usuário citado por outro registro, com o nome atual (`usuário removido` se excluído).
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
      additionalProperties: false
    UserSuspension:
      type: object
      description: A suspensão vigente.
      required: [kind, reason, startsAt, endsAt, createdBy]
      properties:
        kind:
          $ref: "#/components/schemas/SuspensionKind"
        reason:
          type: string
          description: Motivo interno, visível só à equipe.
        startsAt:
          $ref: "#/components/schemas/DateTime"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim do prazo; `null` é por tempo indeterminado.
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Quem suspendeu; `null` quando não há usuário (comando de linha).
      additionalProperties: false
    UserDetail:
      type: object
      description: |
        Ficha do usuário: os campos de `UserSummary` e mais os da ficha. Sem campo de senha; a
        senha só sai em `POST /api/v1/users/{id}/password/reveal`.
      required:
        - id
        - name
        - email
        - emailVerified
        - role
        - avatarUrl
        - status
        - createdAt
        - lastLoginAt
        - fullName
        - hasPassword
        - identities
        - suspension
        - version
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        emailVerified:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: Variante de 256 px do avatar; `null` sem avatar.
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        lastLoginAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        fullName:
          type: [string, "null"]
          description: Nome completo, usado em pedidos e certificados.
        hasPassword:
          type: boolean
          description: Verdadeiro quando a conta tem senha definida.
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        suspension:
          oneOf:
            - $ref: "#/components/schemas/UserSuspension"
            - type: "null"
          description: A suspensão vigente; `null` sem suspensão.
        version:
          type: integer
          minimum: 1
          description: Versão da ficha, enviada de volta em `PATCH /api/v1/users/{id}`.
      additionalProperties: false
    PasswordReveal:
      type: object
      description: |
        Única resposta da API com o campo de senha (`specs/007-contas-e-autenticacao.md`, RF-09;
        ADR 0002). Não vai para log, auditoria nem cache.
      required: [password]
      properties:
        password:
          type: [string, "null"]
          description: A senha em texto; `null` quando o usuário não tem senha definida.
      additionalProperties: false
    AuditOrigin:
      type: string
      enum: [admin_panel, mcp, classroom, worker, cli]
      description: Por onde a ação foi feita (`specs/028-auditoria.md`).
    AuditOutcome:
      type: string
      enum: [ok, denied, error]
    AuditEntry:
      type: object
      description: |
        Um registro da auditoria, sem `details`. `actor` e `target` trazem o nome atual quando o
        alvo é um usuário (`usuário removido` se excluído).
      required:
        - id
        - createdAt
        - actor
        - actorRole
        - origin
        - mcpKeyId
        - action
        - targetType
        - targetId
        - targetName
        - outcome
        - ip
        - userAgent
        - requestId
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Quem agiu; `null` em `worker` e `cli`. No MCP, o emissor da chave.
        actorRole:
          oneOf:
            - $ref: "#/components/schemas/UserRole"
            - type: "null"
          description: Papel do ator no momento da ação.
        origin:
          $ref: "#/components/schemas/AuditOrigin"
        mcpKeyId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        action:
          type: string
          description: Código da ação (`specs/028-auditoria.md`, "O que é registrado").
          examples: [user.password_view]
        targetType:
          type: [string, "null"]
          examples: [user]
        targetId:
          type: [string, "null"]
        targetName:
          type: [string, "null"]
          description: Nome do alvo quando é um usuário; `null` nos demais.
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        ip:
          type: [string, "null"]
          description: IP real do cliente; `null` depois da exclusão da conta.
        userAgent:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
      additionalProperties: false
    AuditEntryDetail:
      type: object
      description: |
        Um registro com `details` (antes e depois dos campos alterados, até 8 KB; campos
        sensíveis aparecem como `"[alterado]"`).
      required:
        - id
        - createdAt
        - actor
        - actorRole
        - origin
        - mcpKeyId
        - action
        - targetType
        - targetId
        - targetName
        - outcome
        - ip
        - userAgent
        - requestId
        - details
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        actorRole:
          oneOf:
            - $ref: "#/components/schemas/UserRole"
            - type: "null"
        origin:
          $ref: "#/components/schemas/AuditOrigin"
        mcpKeyId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        action:
          type: string
        targetType:
          type: [string, "null"]
        targetId:
          type: [string, "null"]
        targetName:
          type: [string, "null"]
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        ip:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        details:
          type: [object, "null"]
          description: |
            JSON livre, conforme a ação; com `truncated: true` quando passou de 8 KB.
          additionalProperties: true
      additionalProperties: false
    AuditEntryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    TermsStatus:
      type: string
      enum: [draft, published]
    TermsVersionEntry:
      type: object
      description: |
        Uma versão de um documento legal na lista do admin, sem o texto (`specs/030-lgpd.md`,
        "Termos na Fase 1"). Rascunho tem `version`, `effectiveAt` e `publishedAt` nulos.
      required:
        - id
        - document
        - version
        - status
        - requiresReacceptance
        - effectiveAt
        - publishedAt
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        document:
          $ref: "#/components/schemas/TermsDocument"
        version:
          type: [integer, "null"]
          minimum: 1
          description: Número sequencial por documento, dado na publicação.
        status:
          $ref: "#/components/schemas/TermsStatus"
        requiresReacceptance:
          type: boolean
        effectiveAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        publishedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    TermsVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Mais nova primeiro.
          items:
            $ref: "#/components/schemas/TermsVersionEntry"
      additionalProperties: false
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    ProductType:
      type: string
      enum: [course, bundle, ebook]
      description: Tipo de produto do catálogo (`specs/009-catalogo-e-conteudo.md`).
    AccessMode:
      type: string
      enum: [open, paid, private]
      description: |
        Modo de acesso do produto (`specs/009-catalogo-e-conteudo.md`, "Modos de acesso"): `open` para
        qualquer usuário logado, `paid` para quem tem direito ativo, `private` só por concessão, pacote
        ou
        plano, e nunca na vitrine.
    PublicationStatus:
      type: string
      enum: [draft, published]
      description: Estado de publicação de produto e de aula; só `published` aparece no classroom.
    CourseLevel:
      type: string
      enum: [beginner, intermediate, advanced]
      description: Nível do curso.
    VideoProvider:
      type: string
      enum: [youtube, vimeo, bunny, panda, file, link]
      description: |
        Provedor do vídeo, classificado pela API a partir da URL na gravação
        (`specs/009-catalogo-e-conteudo.md`,
        "Vídeo e links externos"). URL fora dos padrões da tabela, inclusive `.m3u8` de outro host, vira
        `link` (botão "Abrir vídeo", sem conclusão automática).
    LessonLinkKind:
      type: string
      enum: [file, page]
      description: "Tipo de link de apoio: arquivo ou página."
    LessonLink:
      type: object
      description: Link de apoio de uma aula, na ordem de `position`.
      required: [id, label, url, kind, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        url:
          type: string
          description: URL externa do material; só vai a quem tem acesso à aula.
        kind:
          $ref: "#/components/schemas/LessonLinkKind"
        position:
          type: integer
          minimum: 0
      additionalProperties: false
    ProductCover:
      type: object
      description: |
        Capa de um produto, imagem de finalidade `product_cover` em 16:9 (`specs/029-imagens.md`).
      required: [imageId, url, largeUrl]
      properties:
        imageId:
          $ref: "#/components/schemas/Uuid"
        url:
          type: string
          format: uri-reference
          description: Variante de 480 px (`/api/v1/images/{imageId}/480.webp`).
        largeUrl:
          type: string
          format: uri-reference
          description: Variante de 1280 px (`/api/v1/images/{imageId}/1280.webp`).
      additionalProperties: false
    CertificateState:
      type: string
      enum: [preparing, issued, revoked]
      description: |
        Estado de um certificado existente: `preparing` (registro criado, PDF ainda não gerado),
        `issued` (com PDF) ou `revoked` (`specs/015-certificados.md`).
    Slug:
      type: string
      minLength: 1
      maxLength: 160
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      description: "Identificador legível na URL: minúsculas, dígitos e hífens."
      examples: [introducao-ao-python]
    # --- só admin-api: catálogo, aprendizado e certificados (Fase 2) ---
    ImagePurpose:
      type: string
      enum: [product_cover, school_logo]
      description: |
        Finalidade da imagem enviada pelo admin (`specs/029-imagens.md`). `product_cover` é a capa
        de curso, ebook e pacote, de `instructor`, `manager` e `admin`; `school_logo` é o logotipo
        da escola, só do `admin`, enviado antes de `PUT /api/v1/settings/branding`.
    ImageVariantInfo:
      type: object
      description: |
        Uma variante gerada da imagem enviada. `width` é o nome da variante — a largura nas
        finalidades com corte e o maior lado do arquivo gerado nas de proporção original —, e
        `height` é a altura real gravada.
      required: [width, height, url]
      properties:
        width:
          $ref: "#/components/schemas/ImageVariantWidth"
        height:
          type: integer
          minimum: 1
          description: |
            Altura real do arquivo gerado. Na variante retrato de finalidade de proporção
            original, a largura real não é gravada: sai da proporção de `width`/`height` da
            imagem enviada.
        url:
          type: string
          format: uri-reference
          description: Caminho de entrega (`/api/v1/images/{imageId}/{variant}.webp`).
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/480.webp]
      additionalProperties: false
    Image:
      type: object
      description: Imagem enviada, com as variantes geradas.
      required: [id, purpose, width, height, variants]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        purpose:
          $ref: "#/components/schemas/ImagePurpose"
        width:
          type: integer
          minimum: 1
          description: Largura do arquivo enviado, em pixels.
        height:
          type: integer
          minimum: 1
          description: Altura do arquivo enviado, em pixels.
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImageVariantInfo"
      additionalProperties: false
    CourseSummary:
      type: object
      description: Um curso na lista do admin.
      required:
        [
          id,
          slug,
          title,
          summary,
          cover,
          accessMode,
          priceCents,
          accessDays,
          status,
          level,
          owner,
          reviewRequestedAt,
          moduleCount,
          lessonCount,
          durationSeconds,
          publishedAt,
          archivedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        summary:
          type: [string, "null"]
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        priceCents:
          type: [integer, "null"]
          minimum: 0
          description: Preço em centavos; `null` fora do modo `paid`.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso a partir da compra; `null` é vitalício.
        status:
          $ref: "#/components/schemas/PublicationStatus"
        level:
          oneOf:
            - $ref: "#/components/schemas/CourseLevel"
            - type: "null"
        owner:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Instrutor dono; `null` sem dono.
        reviewRequestedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Pedido de publicação pendente (`request-review`).
        moduleCount:
          type: integer
          minimum: 0
        lessonCount:
          type: integer
          minimum: 0
          description: Aulas publicadas.
        durationSeconds:
          type: integer
          minimum: 0
          description: Soma das durações das aulas publicadas.
        publishedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: "Preenchido quando arquivado: fora do classroom em definitivo."
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    CourseSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CourseSummary"
    CourseDetail:
      type: object
      description: O curso para o editor, com módulos e aulas na ordem.
      required:
        [
          id,
          slug,
          title,
          summary,
          cover,
          accessMode,
          priceCents,
          accessDays,
          status,
          level,
          owner,
          reviewRequestedAt,
          moduleCount,
          lessonCount,
          durationSeconds,
          publishedAt,
          archivedAt,
          createdAt,
          updatedAt,
          description,
          certificateEnabled,
          certificateHours,
          version,
          studentCount,
          modules,
          ebooks,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        summary:
          type: [string, "null"]
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        priceCents:
          type: [integer, "null"]
          minimum: 0
          description: Preço em centavos; `null` fora do modo `paid`.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso a partir da compra; `null` é vitalício.
        status:
          $ref: "#/components/schemas/PublicationStatus"
        level:
          oneOf:
