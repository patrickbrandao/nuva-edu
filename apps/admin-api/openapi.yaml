openapi: 3.1.0
info:
  title: nuva-edu admin-api
  version: 0.1.0
  summary: API do site de administração.
  description: |
    Contrato da `admin-api`, escrito à mão e anterior ao código (ADR 0009). O Fastify valida
    requisições e respostas contra este arquivo, e o cliente de `packages/api-client` é gerado dele.
    Comportamento: `specs/003-admin-api.md`.

    **Caminhos e prefixo.** O servidor é a origem do site (`/`) e cada caminho aparece completo,
    igual à rota registrada no serviço. As rotas de negócio ficam sob `/api/v1`; `/healthz` e
    `/readyz` ficam na raiz, fora do prefixo, porque são sondas do processo e não fazem parte da
    versão da API. `/metrics` (texto Prometheus, só rede interna) não é descrita aqui.

    **Convenções.** JSON em UTF-8, campos em `camelCase`, datas ISO 8601 em UTC, dinheiro em
    centavos inteiros. Erros em `application/problem+json` (RFC 9457) com `code` estável; os
    códigos gerais estão no esquema `Problem` e em `specs/003-admin-api.md`.
    Listagens paginadas por cursor (`limit`, `cursor`) com resposta `{ items, nextCursor }`:
    cada listagem compõe `Page` por `allOf` e declara o próprio `items` (ver o esquema `Page`).
    Toda resposta traz `X-Request-Id`.

    **Sessão.** Cookie `nuva_admin_session` (HttpOnly, Secure, SameSite=Lax).

    **CSRF.** Toda operação que altera dados exige, além do cookie, o cabeçalho `X-CSRF-Token`
    com o token devolvido em `GET /api/v1/session`; sem ele, ou com valor diferente, a resposta
    é `403` com `code: csrf_token_invalid`. No contrato a exigência é o esquema de segurança
    `csrfToken`, declarado junto de `sessionCookie` no `security` de cada operação de escrita, e
    não um parâmetro de cabeçalho: é uma credencial da sessão, igual em todas as escritas, que o
    cliente de `packages/api-client` preenche sozinho. Como parâmetro obrigatório, o tipo gerado
    cobraria o cabeçalho em cada chamada; como parâmetro opcional, o contrato diria que a API
    aceita escrita sem ele. Operação de escrita sem `csrfToken` no `security` é exceção e diz o
    motivo na própria descrição.

    **Componentes comuns.** Os esquemas, parâmetros, cabeçalhos, respostas e o esquema de
    segurança `csrfToken`, marcados como
    "comum" em `components` são idênticos nos contratos da `admin-api` e da `classroom-api`;
    mudança em um é feita nos dois.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Mesma origem do site (uso normal; o site só chama a API do próprio endereço).
  - url: "{scheme}://{host}"
    description: Endereço explícito de uma instalação.
    variables:
      scheme:
        enum: [http, https]
        default: https
      host:
        default: edu-admin.localhost:8080
        description: Valor de `NUVA_ADMIN_HOST`, com a porta quando não for 80/443.
tags:
  - name: health
    description: Sondas do processo, fora de `/api/v1`.
  - name: meta
    description: Dados públicos da instalação e da marca da escola.
  - name: auth
    description: Login, sessão e login social da equipe (`specs/007-contas-e-autenticacao.md`).
  - name: users
    description: Alunos e equipe (`specs/007-contas-e-autenticacao.md`, `specs/008-papeis-e-permissoes.md`).
  - name: audit
    description: Consulta ao registro de auditoria (`specs/028-auditoria.md`).
  - name: terms
    description: Versões dos Termos de Uso e da Política de Privacidade (`specs/030-lgpd.md`).
  - name: images
    description: Entrega de imagens (`specs/029-imagens.md`).
  - name: catalog
    description: Cursos, módulos, aulas, ebooks e pacotes (`specs/009-catalogo-e-conteudo.md`).
  - name: entitlements
    description: Direitos de acesso e concessão manual (`specs/010-direitos-de-acesso.md`).
  - name: progress
    description: Progresso dos alunos (`specs/014-aprendizado-e-progresso.md`).
  - name: certificates
    description: Certificados, templates e signatário (`specs/015-certificados.md`).
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Processo vivo
      description: |
        Responde sem tocar no banco. Usada pelo `healthcheck` do Docker.
      security: []
      responses:
        "200":
          description: O processo responde.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Pronto para atender
      description: |
        Confere a conexão com o banco e se as migrations estão na versão esperada. Não é roteada
        pelo proxy: serve ao `depends_on` do Compose e ao diagnóstico.
      security: []
      responses:
        "200":
          description: Pronto.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Não pronto; `checks` indica o que falhou.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Dados públicos da instalação
      description: |
        Dados públicos da instalação e da marca da escola: nome, versão, moeda, idioma, provedores
        de login social ativos, logotipo, cor de destaque e endereço do código-fonte. Não exige
        sessão. É o único endpoint de marca: os dois sites o chamam ao carregar, e as duas APIs
        devolvem o mesmo esquema `Meta`. Nome, logotipo, cor e endereço do código-fonte vêm da
        configuração da escola (`settings`), com o padrão quando não há nada gravado.
      security: []
      responses:
        "200":
          description: Dados da instalação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login da equipe por e-mail e senha
      description: |
        Abre a sessão do site admin (`specs/007-contas-e-autenticacao.md`, "Login por senha") e
        grava o cookie `nuva_admin_session`.

        - Qualquer falha de credencial: `401` `invalid_credentials`, no mesmo tempo.
        - Conta com suspensão `full`, só depois de a senha conferir: `403` `account_suspended`.
        - Senha certa de quem tem papel `student`: `403` `staff_only`, sem abrir sessão.
        - Conta ou IP bloqueado por tentativas erradas: `429` `too_many_attempts`, com
          `Retry-After`.

        **Exceção de CSRF.** Não declara `csrfToken`: ainda não há sessão. A proteção é o corpo só
        em `application/json` (outro tipo: `415`) e o cookie de sessão `SameSite=Lax`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  description: Sem regra de tamanho aqui; qualquer valor errado é `invalid_credentials`.
              additionalProperties: false
      responses:
        "200":
          description: Sessão aberta.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sair
      x-permission: admin.access
      description: Encerra a sessão atual do site admin e apaga o cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Sessão encerrada; o cookie é apagado.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Sessão atual
      x-permission: admin.access
      description: |
        Dono da sessão, token CSRF e ações permitidas, que o site usa para montar o menu
        (`specs/008-papeis-e-permissoes.md`). Sem sessão válida: `401` `unauthenticated`, e o
        cookie é apagado.
      responses:
        "200":
          description: A sessão atual.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Início do login social da equipe
      description: |
        O site **navega** para esta URL (navegação de página, não `fetch`;
        `specs/007-contas-e-autenticacao.md`, "Fluxo do provedor"). A API gera `state`, `nonce` e
        o verificador PKCE, grava o cookie de retorno `nuva_admin_oauth` (10 minutos) e
        redireciona para a autorização do provedor. No admin só existe login: não há cadastro
        nem vínculo. Provedor desligado nesta instalação: `404`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthProviderPath"
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "302":
          description: Redireciona para a autorização do provedor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [auth]
      summary: Retorno do provedor (Google, Facebook)
      description: |
        Retorno do provedor com `code` e `state` (ou `error`) na consulta. Parâmetros a mais que
        o provedor envie são ignorados. A identidade precisa já estar vinculada, ou casar por
        e-mail verificado com uma conta da equipe (`specs/007-contas-e-autenticacao.md`, "Login
        social e vínculo"). Provedor desligado: `404`.

        Com o provedor ligado, sempre responde `302` para o próprio site, nunca com corpo de erro:

        | Resultado | `Location` |
        | --- | --- |
        | Entrou (sessão aberta, `Set-Cookie` da sessão) | `returnTo` |
        | Erro | `/entrar?erro=<code>` |

        Códigos na URL: `oauth_state_invalid`, `oauth_denied`, `oauth_provider_error`,
        `account_suspended`, `staff_only` (sem conta da equipe). O cookie de retorno é apagado.
        A Apple volta por `POST` (`oauthCallbackForm`).
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthProviderPath"
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          description: Enviado pelo provedor quando o usuário recusa ou algo falha lá.
          schema:
            type: string
            maxLength: 512
      responses:
        "302":
          $ref: "#/components/responses/OAuthReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: oauthCallbackForm
      tags: [auth]
      summary: Retorno do provedor por formulário (Apple)
      description: |
        Retorno da Apple com `response_mode=form_post`: `POST`
        `application/x-www-form-urlencoded` vindo do site da Apple. Mesmo tratamento e mesmos
        destinos de `oauthCallback`. Só `apple` usa este método; outro provedor recebe `302` para
        `/entrar?erro=oauth_provider_error`.

        **Exceção de CSRF.** Não declara `csrfToken`: o `POST` vem de outro site, sem sessão nem
        token. A proteção é o `state`, conferido em tempo constante com o do cookie de retorno
        (`SameSite=None`, `Path=/api/v1/auth`).
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthProviderPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 4096
                state:
                  type: string
                  maxLength: 512
                id_token:
                  type: string
                  maxLength: 16384
                user:
                  type: string
                  maxLength: 4096
                  description: JSON em texto com `name` e `email`, enviado só na primeira vez.
                error:
                  type: string
                  maxLength: 512
      responses:
        "302":
          $ref: "#/components/responses/OAuthReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Listar alunos e equipe
      x-permission: users.list
      description: |
        Busca por nome ou e-mail (`q`), filtros por papel e situação, paginação por cursor. Na
        Fase 1 exige `users.list` com alcance total (`manager` e `admin`); o `instructor` recebe
        `403` (`specs/008-papeis-e-permissoes.md`).
      parameters:
        - name: q
          in: query
          description: Trecho do nome ou do e-mail.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: status
          in: query
          description: |
            `active` (sem suspensão), `suspended` (com suspensão vigente) ou `unverified` (e-mail
            não confirmado).
          schema:
            type: string
            enum: [active, suspended, unverified]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -createdAt, -lastLoginAt]
            default: -createdAt
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página de usuários.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createUser
      tags: [users]
      summary: Criar conta (equipe)
      x-permission: staff.manage
      description: |
        Só `admin` (`specs/007-contas-e-autenticacao.md`, "Equipe criada pelo admin"). A conta
        nasce com o e-mail não confirmado e recebe `account.verify_email`; o admin informa a
        senha à pessoa por fora do sistema.

        - Senha fora de 8 a 128 caracteres: `400` `password_invalid`.
        - E-mail já cadastrado: `409` `email_taken` (para promover uma conta existente, muda-se o
          papel).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  $ref: "#/components/schemas/Email"
                role:
                  $ref: "#/components/schemas/UserRole"
                password:
                  type: string
                  description: 8 a 128 caracteres; fora disso, `password_invalid`.
              additionalProperties: false
      responses:
        "201":
          description: Conta criada.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Ficha de um usuário
      x-permission: users.list
      description: |
        A ficha completa. `users.view` é a mesma ação de `users.list`
        (`specs/008-papeis-e-permissoes.md`, "Identificadores das ações").
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: A ficha.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Editar dados de um usuário
      x-permission: users.edit
      description: |
        Nome, nome completo e e-mail. Conta de aluno: `users.edit` (`manager` e `admin`); conta
        da equipe: `staff.manage` (só `admin`). Trocar o e-mail anula a confirmação e envia
        `account.verify_email` ao novo endereço.

        - `version` diferente da gravada: `409` `version_conflict`.
        - E-mail já cadastrado em outra conta: `409` `email_taken`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                fullName:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 160
                  description: Nome completo, usado em pedidos e certificados; `null` apaga.
                email:
                  $ref: "#/components/schemas/Email"
                version:
                  type: integer
                  minimum: 1
                  description: O `version` da ficha lida.
              additionalProperties: false
      responses:
        "200":
          description: Ficha atualizada.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users/{id}/role:
    patch:
      operationId: setUserRole
      tags: [users]
      summary: Mudar o papel
      x-permission: staff.manage
      description: |
        Só `admin` (`specs/008-papeis-e-permissoes.md`, "Mudança de papel"). Encerra as sessões
        do usuário no site admin e o avisa por e-mail (`account.role_changed`).

        - Rebaixar o último `admin` ativo: `422` `last_admin`.
        - Mudar o próprio papel: `422` `self_action_not_allowed`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/UserRole"
              additionalProperties: false
      responses:
        "200":
          description: Papel alterado.
