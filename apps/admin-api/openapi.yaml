          description: Ação exata (`user.suspend`) ou prefixo terminado em `.*` (`user.*`).
          schema:
            type: string
            pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)*(\\.\\*)?$"
            maxLength: 100
        - name: targetType
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: targetId
