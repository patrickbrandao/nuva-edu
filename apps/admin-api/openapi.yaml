            Preço em centavos; exige `product.set_price` (só `admin`; outro papel: `403`). Obrigatório
            (≥ 0) quando o modo é `paid`; `null` nos demais.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
          description: Dias de acesso a partir da compra; `null` é vitalício.
      additionalProperties: false
    BundleUpdate:
      type: object
      description: |
        Só os campos enviados mudam; além de `version` (obrigatória), ao menos um campo. Sem
        `version`: `400`; diferente da gravada: `409` `version_conflict`.
      required: [version]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, "null"]
          maxLength: 300
        description:
          type: [string, "null"]
          maxLength: 20000
          description: Markdown, exibido sanitizado.
        coverImageId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Imagem `product_cover` enviada antes por `POST /api/v1/images`; `null` remove.
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        priceCents:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000000
          description: |
            Preço em centavos; exige `product.set_price` (só `admin`; outro papel: `403`). Obrigatório
            (≥ 0) quando o modo é `paid`; `null` nos demais.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
          description: Dias de acesso a partir da compra; `null` é vitalício.
        version:
          $ref: "#/components/schemas/CatalogVersionInput"
      additionalProperties: false
      minProperties: 2
    EntitlementSource:
      type: string
      enum: [order, subscription, grant, cascade]
      description: Fonte do direito (`specs/010-direitos-de-acesso.md`, "Fontes").
    EntitlementState:
      type: string
      enum: [active, scheduled, expired, revoked]
      description: |
        `active` (vigente), `scheduled` (`startsAt` no futuro), `expired` (passou de `expiresAt`) ou
        `revoked`.
    RevokeReason:
      type: string
      enum: [refund, chargeback, subscription_ended, manual, recalculation, account_deleted]
    EntitlementNode:
      type: object
      description: Um direito com os derivados dele.
      required:
        [
          id,
          product,
          source,
          sourceId,
          parentEntitlementId,
          state,
          startsAt,
          expiresAt,
          revokedAt,
          revokeReason,
          grantedReason,
          grantedBy,
          createdAt,
          children,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product:
          $ref: "#/components/schemas/ProductRef"
        source:
          $ref: "#/components/schemas/EntitlementSource"
        sourceId:
          $ref: "#/components/schemas/Uuid"
        parentEntitlementId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        state:
          $ref: "#/components/schemas/EntitlementState"
        startsAt:
          $ref: "#/components/schemas/DateTime"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: "`null` é vitalício."
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        revokeReason:
          oneOf:
            - $ref: "#/components/schemas/RevokeReason"
            - type: "null"
        grantedReason:
          type: [string, "null"]
          description: Motivo, só em `grant`.
        grantedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Quem concedeu, só em `grant`.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        children:
          type: array
          description: Direitos derivados (cascata), até a profundidade 2.
          items:
            $ref: "#/components/schemas/EntitlementNode"
      additionalProperties: false
    EntitlementTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: As raízes, mais recentes primeiro.
          items:
            $ref: "#/components/schemas/EntitlementNode"
      additionalProperties: false
    StudentRef:
      type: object
      description: "Aluno citado em listas de curso: nome e avatar, sem e-mail."
      required: [id, name, avatarUrl]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: Variante de 256 px do avatar; `null` sem avatar.
      additionalProperties: false
    ProductEntitlement:
      type: object
      required: [id, user, source, via, state, startsAt, expiresAt, revokedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        user:
          $ref: "#/components/schemas/StudentRef"
        source:
          $ref: "#/components/schemas/EntitlementSource"
        via:
          oneOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
          description: Produto da raiz, quando o direito é derivado (pacote ou curso).
        state:
          $ref: "#/components/schemas/EntitlementState"
        startsAt:
          $ref: "#/components/schemas/DateTime"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
      additionalProperties: false
    ProductEntitlementPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProductEntitlement"
    CourseProgressState:
      type: string
      enum: [not_started, in_progress, completed]
      description: Estado do curso para o aluno (`specs/014-aprendizado-e-progresso.md`, "Progresso").
    ProgressCounts:
      type: object
      description: Progresso de um aluno num curso, sobre as aulas publicadas.
      required: [completedLessons, totalLessons, percent, state]
      properties:
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 0
          description: Aulas publicadas.
        percent:
          type: integer
          minimum: 0
          maximum: 100
        state:
          $ref: "#/components/schemas/CourseProgressState"
      additionalProperties: false
    UserCourseProgress:
      type: object
      required: [course, progress, lastActivityAt, certificate]
      properties:
        course:
          $ref: "#/components/schemas/ProductRef"
        progress:
          $ref: "#/components/schemas/ProgressCounts"
        lastActivityAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        certificate:
          oneOf:
            - $ref: "#/components/schemas/CertificateRef"
            - type: "null"
          description: O certificado do curso, quando existe.
      additionalProperties: false
    UserProgressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserCourseProgress"
      additionalProperties: false
    CourseProgressSummary:
      type: object
      description: Resumo de progresso de um curso.
      required: [courseId, totalLessons, studentCount, buckets, completionRate]
      properties:
        courseId:
          $ref: "#/components/schemas/Uuid"
        totalLessons:
          type: integer
          minimum: 0
        studentCount:
          type: integer
          minimum: 0
          description: Alunos com acesso ao curso.
        buckets:
          type: object
          description: Alunos por faixa de progresso.
          required: [notStarted, upTo25, upTo50, upTo75, upTo99, completed]
          properties:
            notStarted:
              type: integer
              minimum: 0
            upTo25:
              type: integer
              minimum: 0
              description: De 1% a 25%.
            upTo50:
              type: integer
              minimum: 0
              description: De 26% a 50%.
            upTo75:
              type: integer
              minimum: 0
              description: De 51% a 75%.
            upTo99:
              type: integer
              minimum: 0
              description: De 76% a 99%.
            completed:
              type: integer
              minimum: 0
          additionalProperties: false
        completionRate:
          type: number
          minimum: 0
          maximum: 1
          description: Concluídos ÷ alunos com acesso; 0 sem alunos.
      additionalProperties: false
    CourseStudent:
      type: object
      required: [user, progress, lastActivityAt, accessExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/StudentRef"
        progress:
          $ref: "#/components/schemas/ProgressCounts"
        lastActivityAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        accessExpiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim do acesso mais longo; `null` vitalício ou curso `open`.
      additionalProperties: false
    CourseStudentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CourseStudent"
    CertificateRef:
      type: object
      required: [id, code, state]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          description: Código com hífens (`XXXX-XXXX-XXXX`).
        state:
          $ref: "#/components/schemas/CertificateState"
      additionalProperties: false
    Certificate:
      type: object
      description: Um certificado, com os dados congelados na emissão.
      required:
        [
          id,
          code,
          state,
          user,
          course,
          studentName,
          courseTitle,
          instructorName,
          hours,
          completedAt,
          issuedAt,
          issuedManually,
          issuedBy,
          issueReason,
          revokedAt,
          revokedBy,
          revokeReason,
          pdfRenderedAt,
          templateVersionId,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          pattern: ^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$
          description: Código com hífens, sem `0`, `O`, `1`, `I` nem `L`.
          examples: [ABCD-EFGH-JKMN]
        state:
          $ref: "#/components/schemas/CertificateState"
        user:
          $ref: "#/components/schemas/UserRef"
        course:
          $ref: "#/components/schemas/ProductRef"
        studentName:
          type: [string, "null"]
          description: Congelado; `null` se a conta foi excluída.
        courseTitle:
          type: string
          description: Congelado na emissão.
        instructorName:
          type: [string, "null"]
        hours:
          type: integer
          minimum: 0
        completedAt:
          $ref: "#/components/schemas/DateTime"
        issuedAt:
          $ref: "#/components/schemas/DateTime"
        issuedManually:
          type: boolean
        issuedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        issueReason:
          type: [string, "null"]
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        revokedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        revokeReason:
          type: [string, "null"]
        pdfRenderedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        templateVersionId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    CertificatePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Certificate"
    CertificateBackfillQueued:
      type: object
      required: [courseId, queued]
      properties:
        courseId:
          $ref: "#/components/schemas/Uuid"
        queued:
          type: boolean
          const: true
      additionalProperties: false
    CertificateTemplateSource:
      type: string
      enum: [course, school, none]
      description: |
        Origem do template efetivo: o do curso, o padrão da escola ou nenhum (o curso não emite
        certificado).
    CertificateTemplate:
      type: object
      description: Um template de certificado e a origem do efetivo.
      required: [source, html, versionId, updatedAt, updatedBy]
      properties:
        source:
          $ref: "#/components/schemas/CertificateTemplateSource"
        html:
          type: [string, "null"]
          description: O template deste recurso (do curso ou o padrão); `null` quando não tem.
        versionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Versão atual, enviada de volta em `expectedVersionId`.
        updatedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        updatedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
      additionalProperties: false
    CertificateTemplateSaved:
      type: object
      description: O template gravado.
      required: [source, html, versionId, updatedAt, updatedBy, backfillQueued]
      properties:
        source:
          $ref: "#/components/schemas/CertificateTemplateSource"
        html:
          type: string
        versionId:
          $ref: "#/components/schemas/Uuid"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        backfillQueued:
          type: boolean
          description: Verdadeiro quando a gravação enfileirou a emissão retroativa.
      additionalProperties: false
    CertificateTemplateSave:
      type: object
      required: [html, expectedVersionId]
      properties:
        html:
          type: string
          minLength: 1
          description: |
            Documento HTML completo ou fragmento, até 768 KiB em UTF-8, com as imagens embutidas (acima:
            problema `too_large`).
        expectedVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: A versão que o editor abriu; `null` quando não havia template.
      additionalProperties: false
    CertificateTemplateProblemRule:
      type: string
      enum:
        [
          parse_error,
          too_large,
          element_not_allowed,
          attribute_not_allowed,
          url_not_allowed,
          css_not_allowed,
          image_not_found,
          unknown_key,
          unclosed_key,
          key_in_attribute,
          missing_required_key,
        ]
      description: Regra violada (`specs/015-certificados.md`, "Template").
    CertificateTemplateProblem:
      type: object
      required: [rule, message, line, column]
      properties:
        rule:
          $ref: "#/components/schemas/CertificateTemplateProblemRule"
        message:
          type: string
        line:
          type: integer
          minimum: 1
          description: Linha no HTML enviado, a partir de 1; problema do documento inteiro vem em 1:1.
        column:
          type: integer
          minimum: 1
      additionalProperties: false
    CertificateTemplateInvalidProblem:
      description: |
        `Problem` de `422` `certificate_template_invalid`, com a lista de problemas em
        `details.problems`, na ordem em que foram encontrados e até 200 itens: com 200, pode haver
        mais problemas além dos listados. Outro `422` da operação não traz `details`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            details:
              type: object
              required: [problems]
              properties:
                problems:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/CertificateTemplateProblem"
              additionalProperties: false
    CertificateTemplateKeyName:
      type: string
      enum:
        [
          aluno.nome,
          curso.titulo,
          curso.carga_horaria,
          curso.instrutor,
          certificado.data_conclusao,
          certificado.data_conclusao_curta,
          certificado.data_emissao,
          certificado.codigo,
          certificado.url_validacao,
          certificado.qrcode,
          escola.nome,
          assinatura.nome,
          assinatura.cargo,
        ]
      description: Palavra-chave do template (`specs/015-certificados.md`, "Template").
    CertificateTemplateKey:
      type: object
      required: [key, placeholder, description, example, required, requiredOneOf]
      properties:
        key:
          $ref: "#/components/schemas/CertificateTemplateKeyName"
        placeholder:
          type: string
          description: Como escrever no template.
          examples: ["{{aluno.nome}}"]
        description:
          type: string
        example:
          type: string
          description: |
            Valor usado no PDF de exemplo. Em `certificado.qrcode`, um texto que descreve o código QR,
            não o SVG.
        required:
          type: boolean
          description: Sempre obrigatória (`aluno.nome`, `curso.titulo`, `certificado.codigo`).
        requiredOneOf:
          type: boolean
          description: |
            Verdadeiro nas que se alternam (`certificado.url_validacao` e `certificado.qrcode`): o
            template precisa de ao menos uma delas.
      additionalProperties: false
    CertificateTemplateReference:
      type: object
      required: [keys, modelHtml]
      properties:
        keys:
          type: array
          description: As 13 palavras-chave, na ordem da spec.
          items:
            $ref: "#/components/schemas/CertificateTemplateKey"
        modelHtml:
          type: string
          description: O modelo inicial, que passa na própria validação.
      additionalProperties: false
    CertificatePreviewStatus:
      type: string
      enum: [pending, ready, failed]
    CertificatePreview:
      type: object
      required: [id, courseId, status, error, createdAt, renderedAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        courseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        status:
          $ref: "#/components/schemas/CertificatePreviewStatus"
        error:
          type: [string, "null"]
          description: Motivo, em `failed`.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        renderedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
          description: Quando o pedido é apagado (24 h).
      additionalProperties: false
    CertificateSettings:
      type: object
      required: [signerName, signerRole, schoolName]
      properties:
        signerName:
          type: [string, "null"]
          description: "`certificate.signer_name`."
        signerRole:
          type: [string, "null"]
          description: "`certificate.signer_role`."
        schoolName:
          type: string
          description: "`school.name`, só leitura aqui."
      additionalProperties: false
    # --- só admin-api: vendas e pagamentos (specs 011 e 013) ---
    TaxIdType:
      type: string
      enum: [cpf, cnpj]
      description: Tipo do documento fiscal do comprador (`specs/011-vendas-e-checkout.md`).
    CouponKind:
      type: string
      enum: [percent, fixed]
      description: |
        `percent` desconta uma porcentagem de cada item elegível; `fixed` desconta um valor em
        centavos rateado entre os itens elegíveis (`specs/011-vendas-e-checkout.md`, "Cupons").
    CouponAppliesTo:
      type: string
      enum: [orders, subscriptions, both]
      description: |
        A que o cupom se aplica (`specs/012-assinaturas.md`, "Cupom na assinatura"): pedidos
        avulsos (`orders`), assinaturas (`subscriptions`) ou os dois (`both`). Na assinatura, o
        cupom vale só na primeira cobrança.
    CouponProductInput:
      type: object
      description: Produto restringindo o cupom; vazio é o mesmo que todos.
      required: [productType, productId]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    CouponProduct:
      type: object
      description: Produto elegível do cupom, com o título atual.
      required: [productType, productId, title]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
      additionalProperties: false
    CouponInput:
      type: object
      description: |
        Definição de um cupom novo (`specs/011-vendas-e-checkout.md`, "Cupons"). `appliesTo` tem
        padrão `orders` e `active`, `true`.
      required: [code, kind]
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[A-Za-z0-9-]+$"
          description: Comparado sem diferenciar maiúsculas.
        kind:
          $ref: "#/components/schemas/CouponKind"
        percentOff:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Obrigatório em `percent`; proibido em `fixed`.
        amountOffCents:
          type: [integer, "null"]
          minimum: 1
          description: Obrigatório em `fixed`; proibido em `percent`.
        startsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Início da validade; `null` sem prazo para começar.
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim da validade; `null` sem prazo para acabar.
        maxUses:
          type: [integer, "null"]
          minimum: 1
          description: Total de usos; `null` ilimitado.
        maxUsesPerUser:
          type: integer
          minimum: 1
          default: 1
        appliesTo:
          $ref: "#/components/schemas/CouponAppliesTo"
        products:
          type: array
          maxItems: 500
          default: []
          description: Restrição de produtos; vazia vale para todos.
          items:
            $ref: "#/components/schemas/CouponProductInput"
        active:
          type: boolean
          default: true
      additionalProperties: false
    CouponUpdate:
      type: object
      description: |
        Edição parcial: só os campos enviados mudam. `products` enviada substitui a lista inteira
        e `products: []` volta a valer para todos (`specs/011-vendas-e-checkout.md`).
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[A-Za-z0-9-]+$"
        kind:
          $ref: "#/components/schemas/CouponKind"
        percentOff:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
        amountOffCents:
          type: [integer, "null"]
          minimum: 1
        startsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        maxUses:
          type: [integer, "null"]
          minimum: 1
        maxUsesPerUser:
          type: integer
          minimum: 1
        appliesTo:
          $ref: "#/components/schemas/CouponAppliesTo"
        products:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CouponProductInput"
        active:
          type: boolean
      additionalProperties: false
    Coupon:
      type: object
      description: Um cupom da escola (`specs/011-vendas-e-checkout.md`, "Cupons").
      required:
        [
          id,
          code,
          kind,
          percentOff,
          amountOffCents,
          startsAt,
          endsAt,
          maxUses,
          maxUsesPerUser,
          usesCount,
          appliesTo,
          products,
          active,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
        kind:
          $ref: "#/components/schemas/CouponKind"
        percentOff:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
        amountOffCents:
          type: [integer, "null"]
          minimum: 1
        startsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        maxUses:
          type: [integer, "null"]
          minimum: 1
          description: "`null` ilimitado."
        maxUsesPerUser:
          type: integer
          minimum: 1
        usesCount:
          type: integer
          minimum: 0
          description: |
            Usos contabilizados. Pode passar de `maxUses`: pedido pago com o limite estourado é
            honrado e o excesso fica registrado (spec 011).
        appliesTo:
          $ref: "#/components/schemas/CouponAppliesTo"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CouponProduct"
        active:
          type: boolean
        createdBy:
          $ref: "#/components/schemas/UserRef"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    CouponPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Coupon"
    OrderStatus:
      type: string
      enum: [draft, pending, paid, partially_refunded, refunded, canceled, expired, chargeback]
      description: |
        Estado do pedido (`specs/011-vendas-e-checkout.md`, "Pedido e seus estados"). `draft` é
        resto de tentativa que não chegou ao provedor: aparece na consulta do admin, não na do
        aluno.
    PaymentStatus:
      type: string
      enum: [pending, approved, rejected, canceled, refunded, partially_refunded, charged_back]
      description: Estado normalizado da cobrança no provedor (`specs/013-pagamentos-mercado-pago.md`).
    PaymentMethod:
      type: string
      enum: [card, pix, boleto, other]
      description: Meio de pagamento informado pelo provedor; `other` quando não é um dos três.
    PaymentProviderName:
      type: string
      enum: [mercadopago, fake, none]
      description: |
        Provedor da cobrança; `none` no pedido de total zero, que não passa pelo provedor
        (`NUVA_PAYMENT_PROVIDER`).
    RefundStatus:
      type: string
      enum: [requested, done, failed]
      description: |
        `requested` enquanto o estorno não voltou; `done` com o estorno confirmado; `failed` com o
        motivo em `error`, podendo ser tentado de novo (`specs/011-vendas-e-checkout.md`).
    WebhookEventStatus:
      type: string
      enum: [received, rejected, processed, ignored, failed]
      description: |
        Estado do aviso em `webhook_events` (`specs/013-pagamentos-mercado-pago.md`). `rejected` é
        a trilha de assinatura recusada, só leitura; `failed` é a falha operacional que aceita
        reprocessamento.
    WebhookResourceType:
      type: string
      enum: [payment, subscription]
      description: Tipo do recurso citado no aviso.
    OrderBuyer:
      type: object
      description: O comprador na lista de pedidos, sem o documento fiscal.
      required: [id, name, email]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
      additionalProperties: false
    OrderBuyerDetail:
      type: object
      description: |
        O comprador no detalhe do pedido. O documento fiscal só aparece aqui e no CSV, nunca nos
        logs (`specs/011-vendas-e-checkout.md`).
      required: [id, name, email, taxIdType, taxId]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        taxIdType:
          $ref: "#/components/schemas/TaxIdType"
        taxId:
          type: string
          description: Só os caracteres do documento, sem pontuação.
      additionalProperties: false
    OrderProductRef:
      type: object
      description: Um item do pedido, só com o necessário para a lista.
      required: [productType, productId, title]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          description: Título congelado no fechamento do pedido.
      additionalProperties: false
    OrderItem:
      type: object
      description: Um item do pedido, com os valores congelados no fechamento.
      required:
        [
          id,
          productType,
          productId,
          title,
          accessDays,
          unitPriceCents,
          discountCents,
          paidCents,
          refundedCents,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso congelados; `null` é vitalício.
        unitPriceCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        paidCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Preço menos o desconto rateado; o valor efetivamente pago.
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
      additionalProperties: false
    OrderTotals:
      type: object
      description: |
        Somas de todos os pedidos que casam com o filtro, não só da página
        (`specs/011-vendas-e-checkout.md`, "Consulta e exportação").
      required: [subtotalCents, discountCents, refundedCents, totalCents, netCents]
      properties:
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Bruto, antes dos descontos.
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Cobrado, depois dos descontos.
        netCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Cobrado menos os reembolsos.
      additionalProperties: false
    OrderSummary:
      type: object
      description: Um pedido na lista do admin, sem o documento fiscal.
      required:
        [
          id,
          number,
          status,
          buyer,
          itemCount,
          items,
          subtotalCents,
          discountCents,
          refundedCents,
          totalCents,
          currency,
          couponCode,
          provider,
          paymentMethod,
          createdAt,
          paidAt,
          expiresAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: integer
          minimum: 1
          description: Número legível e sequencial do pedido, com saltos aceitos.
        status:
          $ref: "#/components/schemas/OrderStatus"
        buyer:
          $ref: "#/components/schemas/OrderBuyer"
        itemCount:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderProductRef"
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        couponCode:
          type: [string, "null"]
          description: Código do cupom congelado no pedido; `null` sem cupom.
        provider:
          $ref: "#/components/schemas/PaymentProviderName"
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
          description: Meio da cobrança conhecida; `null` antes da primeira cobrança.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Prazo do `pending`; `null` fora dele.
      additionalProperties: false
    OrderSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items, totals]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderSummary"
            totals:
              $ref: "#/components/schemas/OrderTotals"
    OrderDetail:
      type: object
      description: |
        O pedido completo, com comprador, valores congelados, cobranças e reembolsos
        (`specs/011-vendas-e-checkout.md`). O documento fiscal só sai aqui e no CSV.
      required:
        [
          id,
          number,
          status,
          buyer,
          itemCount,
          subtotalCents,
          discountCents,
          refundedCents,
          totalCents,
          currency,
          couponCode,
          provider,
          createdAt,
          paidAt,
          expiresAt,
          items,
          payments,
          refunds,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/OrderStatus"
        buyer:
          $ref: "#/components/schemas/OrderBuyerDetail"
        itemCount:
          type: integer
          minimum: 1
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        couponCode:
          type: [string, "null"]
          description: Código do cupom congelado no pedido; `null` sem cupom.
        provider:
          $ref: "#/components/schemas/PaymentProviderName"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Prazo do `pending` (30 min no cartão e no Pix, 3 dias no boleto); `null` fora dele.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payments:
          type: array
          description: Cobranças conhecidas do pedido, da mais recente à mais antiga.
          items:
            $ref: "#/components/schemas/Payment"
        refunds:
          type: array
          description: Reembolsos do pedido, do mais recente ao mais antigo.
          items:
            $ref: "#/components/schemas/Refund"
      additionalProperties: false
    RefundItemInput:
      type: object
      description: Item e valor a reembolsar (`specs/011-vendas-e-checkout.md`, "Reembolso").
      required: [orderItemId, amountCents]
      properties:
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        amountCents:
          type: integer
          minimum: 1
          description: Em centavos; no máximo o pago e ainda não reembolsado do item.
      additionalProperties: false
    RefundItem:
      type: object
      description: Item reembolsado, com o título congelado do pedido.
      required: [orderItemId, title, amountCents]
      properties:
        orderItemId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        amountCents:
          $ref: "#/components/schemas/MoneyCents"
      additionalProperties: false
    Refund:
      type: object
      description: Um reembolso pedido, em execução ou concluído.
      required:
        [
          id,
          paymentId,
          items,
          amountCents,
          reason,
          status,
          providerRefundId,
          error,
          requestedBy,
          createdAt,
          doneAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        orderId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Pedido reembolsado; `null` no reembolso de cobrança recorrente.
        paymentId:
          $ref: "#/components/schemas/Uuid"
        items:
          type: array
          description: Itens e valores do pedido; vazia no reembolso de cobrança recorrente.
          items:
            $ref: "#/components/schemas/RefundItem"
        amountCents:
          $ref: "#/components/schemas/MoneyCents"
        reason:
          type: string
          description: Motivo informado pelo admin.
        status:
          $ref: "#/components/schemas/RefundStatus"
        providerRefundId:
          type: [string, "null"]
          description: Identificador do estorno no provedor; `null` até a confirmação.
        error:
          type: [string, "null"]
          description: Motivo da falha, quando `status` é `failed`; nunca o corpo do provedor.
        requestedBy:
          $ref: "#/components/schemas/UserRef"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        doneAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Quando o estorno foi confirmado; `null` fora de `done`.
      additionalProperties: false
    Payment:
      type: object
      description: |
        Uma cobrança conhecida (`specs/013-pagamentos-mercado-pago.md`). Sem dado de cartão e sem
        o corpo devolvido pelo provedor; só o estado original em `rawStatus`.
      required:
        [
          id,
          orderId,
          orderNumber,
          subscriptionId,
          provider,
          providerPaymentId,
          status,
          method,
          amountCents,
          refundedCents,
          currency,
          rawStatus,
          paidAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        orderId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Pedido da cobrança; `null` em cobrança de assinatura.
        orderNumber:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: Número legível do pedido; `null` em cobrança de assinatura.
        subscriptionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Assinatura da cobrança; `null` em cobrança de pedido.
        provider:
          type: string
          enum: [mercadopago, fake]
        providerPaymentId:
          type: string
        status:
          $ref: "#/components/schemas/PaymentStatus"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        rawStatus:
          type: string
          description: Estado original devolvido pelo provedor, para diagnóstico.
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    PaymentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Payment"
    PaymentDetail:
      type: object
      description: A cobrança com os reembolsos relacionados.
      required:
        [
          id,
          orderId,
          orderNumber,
          subscriptionId,
          provider,
          providerPaymentId,
          status,
          method,
          amountCents,
          refundedCents,
          currency,
          rawStatus,
          paidAt,
          createdAt,
          updatedAt,
          refunds,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        orderId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        orderNumber:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        subscriptionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        provider:
          type: string
          enum: [mercadopago, fake]
        providerPaymentId:
          type: string
        status:
          $ref: "#/components/schemas/PaymentStatus"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        rawStatus:
          type: string
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
      additionalProperties: false
    WebhookEvent:
      type: object
      description: |
        Um aviso de pagamento recebido (`specs/013-pagamentos-mercado-pago.md`). Nunca traz o corpo
        nem os cabeçalhos; em `rejected`, só os metadados mínimos da trilha de segurança.
      required:
        [
          id,
          provider,
          eventId,
          resourceType,
          resourceId,
          status,
          attempts,
          error,
          receivedAt,
          processedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        provider:
          type: string
          enum: [mercadopago, fake]
        eventId:
          type: [string, "null"]
          description: Identificador do evento; `null` quando não foi extraído.
        resourceType:
          oneOf:
            - $ref: "#/components/schemas/WebhookResourceType"
            - type: "null"
        resourceId:
          type: [string, "null"]
          description: Identificador do recurso; `null` quando não foi extraído.
        status:
          $ref: "#/components/schemas/WebhookEventStatus"
        attempts:
          type: integer
          minimum: 0
          description: Tentativas de processamento; zero na trilha `rejected`.
        error:
          type: [string, "null"]
          description: "`invalid_signature` em `rejected`; motivo da falha em `failed`."
        receivedAt:
          $ref: "#/components/schemas/DateTime"
        processedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Quando o evento foi processado ou ignorado; `null` nos demais estados.
      additionalProperties: false
    WebhookEventPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WebhookEvent"
    PaymentSettings:
      type: object
      description: |
        Estado da integração de pagamento (`specs/013-pagamentos-mercado-pago.md`, "Modo de
        teste"). Nunca devolve token, chave pública, segredo do webhook nem URL com credencial.
      required: [provider, testMode, productionWarning, lastReconciliationAt]
      properties:
        provider:
          type: string
          enum: [mercadopago, fake]
          description: "`NUVA_PAYMENT_PROVIDER` em uso."
        testMode:
          type: boolean
          description: O token configurado é de teste; nenhuma cobrança real.
        productionWarning:
          type: boolean
          description: |
            Verdadeiro só quando `NUVA_ENV=production` e o token é de teste: o admin vê o aviso em
            vermelho.
        lastReconciliationAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: |
            Fim da última execução bem-sucedida de `payment.reconcile_orders`; `null` quando ainda
            não houve nenhuma.
      additionalProperties: false
    # --- Fase 3: planos e assinaturas (spec 012) ---
    PlanInterval:
      type: string
      enum: [month, year]
      description: Periodicidade da cobrança do plano (`specs/012-assinaturas.md`, "Planos").
    PlanItemInput:
      type: object
      description: Produto liberado por um plano.
      required: [productType, productId]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    PlanItem:
      type: object
      description: Produto liberado por um plano, com o título atual.
      required: [productType, productId, title]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
      additionalProperties: false
    Plan:
      type: object
      description: |
        Um plano de assinatura com os itens que libera (`specs/012-assinaturas.md`, "Planos").
        O preço do plano vale para novas assinaturas; as existentes mantêm o preço contratado.
      required:
        [
          id,
          slug,
          groupKey,
          title,
          description,
          interval,
          priceCents,
          includesAll,
          includesPrivate,
          active,
          position,
          providerPlanId,
          subscriptionCount,
          items,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        groupKey:
          $ref: "#/components/schemas/Slug"
          description: Chave que agrupa as periodicidades do mesmo conteúdo na vitrine.
        title:
          type: string
        description:
          type: [string, "null"]
        interval:
          $ref: "#/components/schemas/PlanInterval"
        priceCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Preço por período, maior que zero.
        includesAll:
          type: boolean
          description: |
            Verdadeiro = todo produto publicado `paid` ou `open`, atual e futuro; nesse caso
            `items` vem vazia.
        includesPrivate:
          type: boolean
          description: Só com `includesAll`; inclui também os produtos `private`.
        active:
          type: boolean
          description: |
            Plano inativo sai da vitrine e não aceita assinatura nova; as assinaturas existentes
            continuam.
        position:
          type: integer
          minimum: 0
          description: Ordem na vitrine.
        providerPlanId:
          type: [string, "null"]
          description: |
            Identificador do plano no provedor (`ensurePlan`); `null` até o `ensurePlan` rodar
            (`specs/013-pagamentos-mercado-pago.md`).
        subscriptionCount:
          type: integer
          minimum: 0
          description: |
            Assinaturas do plano, inclusive `ended` e `expired`; é o vínculo que impede excluir o
            plano.
        items:
          type: array
          description: Produtos explícitos quando `includesAll` é falso; vazia quando verdadeiro.
          items:
            $ref: "#/components/schemas/PlanItem"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    PlanPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Plan"
    PlanCreate:
      type: object
      description: |
        Definição de um plano novo (`specs/012-assinaturas.md`, "Planos"). `includesAll`,
        `includesPrivate`, `active` e `position` têm padrão falso, falso, verdadeiro e zero;
        `items` tem padrão vazio.
      required: [groupKey, title, interval, priceCents]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
          description: |
            Identificador público; gerado de `groupKey` e `interval` quando ausente e imutável
            depois da criação.
        groupKey:
          $ref: "#/components/schemas/Slug"
          description: |
            Chave que agrupa as periodicidades na vitrine: a mesma nos planos mensal e anual do
            mesmo conteúdo. Imutável.
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, "null"]
          maxLength: 20000
        interval:
          $ref: "#/components/schemas/PlanInterval"
        priceCents:
          type: integer
          minimum: 1
          description: Preço por período.
        includesAll:
          type: boolean
          default: false
        includesPrivate:
          type: boolean
          default: false
        active:
          type: boolean
          default: true
        position:
          type: integer
          minimum: 0
          default: 0
        items:
          type: array
          maxItems: 500
          default: []
          items:
            $ref: "#/components/schemas/PlanItemInput"
      additionalProperties: false
    PlanUpdate:
      type: object
      description: |
        Edição parcial do plano: só os campos enviados mudam. `slug`, `groupKey` e `interval` não
        mudam depois da criação.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, "null"]
          maxLength: 20000
        priceCents:
          type: integer
          minimum: 1
        includesAll:
          type: boolean
        includesPrivate:
          type: boolean
        active:
          type: boolean
        position:
          type: integer
          minimum: 0
      additionalProperties: false
    PlanItemsUpdate:
      type: object
      description: Lista completa que substitui os itens do plano.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/PlanItemInput"
      additionalProperties: false
    SubscriptionStatus:
      type: string
      enum: [pending, active, past_due, suspended, canceling, ended, expired]
      description: |
        Estado da assinatura (`specs/012-assinaturas.md`, "Ciclo de vida"). `pending` aguarda a
        primeira cobrança; `active` está em dia; `past_due` está em carência, com acesso;
        `suspended` perdeu o acesso; `canceling` foi cancelada e mantém o acesso até
        `currentPeriodEnd`; `ended` encerrou; `expired` nunca foi paga, inclusive a `pending`
        cancelada pelo aluno.
    SubscriptionPlanRef:
      type: object
      description: O plano da assinatura, na forma resumida.
      required: [id, title, interval]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        interval:
          $ref: "#/components/schemas/PlanInterval"
      additionalProperties: false
    Subscriber:
      type: object
      description: O assinante na lista e no detalhe da assinatura.
      required: [id, name, email]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
      additionalProperties: false
    AdminSubscriptionSummary:
      type: object
      description: Uma assinatura na lista do admin.
      required:
        [
          id,
          subscriber,
          plan,
          status,
          priceCents,
          currency,
          currentPeriodStart,
          currentPeriodEnd,
          graceUntil,
          nextChargeAt,
          canceledAt,
          cancelReason,
          endedAt,
          createdAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        subscriber:
          $ref: "#/components/schemas/Subscriber"
        plan:
          $ref: "#/components/schemas/SubscriptionPlanRef"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        priceCents:
          $ref: "#/components/schemas/MoneyCents"
          description: |
            Preço contratado, copiado do plano na criação; mudança posterior do plano não o
            altera.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        currentPeriodStart:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        currentPeriodEnd:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim do período pago; com a carência, a referência do acesso.
        graceUntil:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        nextChargeAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: |
            Próxima renovação prevista: `currentPeriodEnd` em `active`; `null` nos demais.
        canceledAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        cancelReason:
          type: [string, "null"]
          description: Motivo do cancelamento informado pelo admin ou pelo aluno.
        endedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    AdminSubscriptionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminSubscriptionSummary"
    AdminSubscriptionDetail:
      type: object
      description: |
        A assinatura com o plano atual, as cobranças e os reembolsos de cada uma
        (`specs/012-assinaturas.md`, "Reembolso de cobrança").
      required:
        [
          id,
          subscriber,
          plan,
          status,
          priceCents,
          currency,
          currentPeriodStart,
          currentPeriodEnd,
          graceUntil,
          nextChargeAt,
          canceledAt,
          cancelReason,
          endedAt,
          createdAt,
          provider,
          providerSubscriptionId,
          couponCode,
          currentPeriodPaymentId,
          payments,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        subscriber:
          $ref: "#/components/schemas/Subscriber"
        plan:
          $ref: "#/components/schemas/Plan"
          description: |
            O plano agora, com preço e itens atuais; o preço contratado é `priceCents` desta
            assinatura.
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        priceCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Preço contratado na criação da assinatura.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        currentPeriodStart:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        currentPeriodEnd:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        graceUntil:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        nextChargeAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        canceledAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        cancelReason:
          type: [string, "null"]
        endedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        provider:
          type: string
          enum: [mercadopago, fake]
        providerSubscriptionId:
          type: [string, "null"]
          description: Identificador da adesão no provedor; `null` até o provedor devolvê-lo.
        couponCode:
          type: [string, "null"]
          description: |
            Código do cupom usado na primeira cobrança; `null` sem cupom ou se o cupom foi
            excluído.
        currentPeriodPaymentId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: |
            A cobrança que abriu o período em curso; reembolsá-la por inteiro encerra a
            assinatura na hora. `null` quando ainda não há cobrança aprovada no período (por
            exemplo, `pending`).
        payments:
          type: array
          description: Cobranças da assinatura, da mais recente para a mais antiga, com reembolsos.
          items:
            $ref: "#/components/schemas/PaymentDetail"
      additionalProperties: false
    SubscriptionRefundInput:
      type: object
      description: Pedido de reembolso de uma cobrança recorrente.
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo informado pelo admin.
        amountCents:
          type: [integer, "null"]
          minimum: 1
          description: |
            Valor a estornar; ausente ou `null` estorna o saldo não reembolsado da cobrança.
            Acima do saldo: `422 refund_exceeds_paid`. O valor que fecha o saldo da cobrança do
            período em curso encerra a assinatura; um valor menor não a encerra.
      additionalProperties: false
    # --- Fase 4: central, stream, operação e identidade (specs 024 e 033) ---
    NotificationGroup:
      type: string
      enum:
        [
          account,
          purchase,
          courses,
          forum,
          messages,
          community,
          events,
          support,
          announcements,
          moderation,
          staff,
        ]
      description: |
        Grupo de preferência (`specs/024-notificacoes-e-email.md`, "Tipos e grupos"); o grupo de
        cada tipo está na mesma tabela.
    NotificationData:
      type: object
      description: |
        Conteúdo do tipo, definido na spec do recurso (o `ticket.opened` traz o protocolo; o
        `ops.job_failed`, o tipo da tarefa). Nunca contém senha, token nem segredo.
      additionalProperties: true
    NotificationActor:
      type: object
      description: Quem gerou o fato; ausente em aviso do sistema.
      required: [id, name, avatarUrl]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          description: Nome de exibição; `usuário removido` quando a conta foi excluída.
        avatarUrl:
          type: [string, "null"]
          description: Caminho da foto de perfil na API, ou nulo.
      additionalProperties: false
    NotificationItem:
      type: object
      description: |
        Um item da central (`specs/024-notificacoes-e-email.md`, "Central"): ícone do tipo, foto,
        título, texto curto, tempo e link para o alvo são montados a partir de `type`, `actor`,
        `data` e do alvo.
      required: [id, type, group, actor, targetType, targetId, data, count, readAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
          description: |
            Tipo da notificação (`specs/024-notificacoes-e-email.md`). Fica em texto, e não em
            `enum`, porque um worker mais novo pode gravar tipo que esta API ainda não conhece.
          examples: [ticket.opened]
        group:
          $ref: "#/components/schemas/NotificationGroup"
        actor:
          oneOf:
            - $ref: "#/components/schemas/NotificationActor"
            - type: "null"
          description: Quem gerou o fato; nulo em aviso do sistema.
        targetType:
          type: [string, "null"]
          description: |
            Tipo do alvo (`ticket`, `report`, `job`...), sempre junto de `targetId`; nulo quando a
            notificação não aponta para um recurso.
        targetId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        data:
          $ref: "#/components/schemas/NotificationData"
        count:
          type: integer
          minimum: 1
          description: Quantas notificações do mesmo tipo e alvo foram fundidas nesta linha.
        readAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Quando foi lida; nulo enquanto não lida.
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationItem"
    NotificationUnreadCount:
      type: object
      description: Não lidas do usuário, para o sino.
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0
      additionalProperties: false
    NotificationReadResult:
      type: object
      description: Item marcado como lido e o contador do sino depois da leitura.
      required: [notification, unreadCount]
      properties:
        notification:
          $ref: "#/components/schemas/NotificationItem"
        unreadCount:
          type: integer
          minimum: 0
      additionalProperties: false
    NotificationsReadAllResult:
      type: object
      description: Resultado de "marcar todas como lidas".
      required: [updated, unreadCount]
      properties:
        updated:
          type: integer
          minimum: 0
          description: Quantas notificações passaram de não lidas a lidas nesta chamada.
        unreadCount:
          type: integer
          const: 0
      additionalProperties: false
    NotificationsCleared:
      type: object
      description: Resultado de "limpar todas".
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Quantas notificações foram apagadas.
      additionalProperties: false
    NotificationGroupPrefs:
      type: object
      description: |
        Canais efetivos de um grupo e as regras que a interface precisa para desabilitar o que
        não pode mudar.
      required: [inApp, email, emailRequired, inAppAvailable]
      properties:
        inApp:
          type: boolean
        email:
          type: boolean
        emailRequired:
          type: boolean
          description: |
            `true` nos grupos obrigatórios (`account`, `purchase`, `support` e `moderation`): o
            e-mail não pode ser desligado (RF-04).
        inAppAvailable:
          type: boolean
          description: "`false` só no grupo `account`, que não tem canal plataforma."
      additionalProperties: false
    NotificationPrefs:
      type: object
      description: |
        Canais efetivos dos onze grupos (`specs/024-notificacoes-e-email.md`, "Tipos e grupos"),
        na ordem da tabela.
      required:
        [
          account,
          purchase,
          courses,
          forum,
          messages,
          community,
          events,
          support,
          announcements,
          moderation,
          staff,
        ]
      properties:
        account:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        purchase:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        courses:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        forum:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        messages:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        community:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        events:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        support:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        announcements:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        moderation:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        staff:
          $ref: "#/components/schemas/NotificationGroupPrefs"
      additionalProperties: false
    NotificationChannelUpdate:
      type: object
      description: Canais a mudar num grupo; canal omitido fica como está.
      minProperties: 1
      properties:
        inApp:
          type: boolean
        email:
          type: boolean
      additionalProperties: false
    NotificationPrefsUpdate:
      type: object
      description: |
        Grupos a mudar; grupo omitido fica como está. Grupo obrigatório com `email: false` e
        grupo `account` com `inApp: true` são recusados com `400 validation_failed`.
      minProperties: 1
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        purchase:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        courses:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        forum:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        messages:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        community:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        events:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        support:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        announcements:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        moderation:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        staff:
          $ref: "#/components/schemas/NotificationChannelUpdate"
    StreamEventId:
      type: string
      pattern: "^[0-9]+$"
      description: |
        Campo `id` do SSE: inteiro em texto, tirado de uma sequência do banco. Crescente para
        cada usuário, não consecutivo.
      examples: ["42"]
    StreamNotificationCreatedData:
      type: object
      required: [notificationId, type, unreadCount]
      properties:
        notificationId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          description: Tipo da notificação (`specs/024-notificacoes-e-email.md`).
        unreadCount:
          type: integer
          minimum: 0
          description: Notificações não lidas do usuário depois desta.
      additionalProperties: false
    StreamPingData:
      type: object
      description: Sempre vazio.
      additionalProperties: false
    StreamEventNotificationCreated:
      type: object
      description: Nova notificação para quem está conectado.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: notification.created
        data:
          $ref: "#/components/schemas/StreamNotificationCreatedData"
      additionalProperties: false
    StreamEventPing:
      type: object
      description: Mantém a conexão viva; enviado a cada 25 s, sem `id`.
      required: [event, data]
      properties:
        event:
          type: string
          const: ping
        data:
          $ref: "#/components/schemas/StreamPingData"
      additionalProperties: false
    StreamEvent:
      description: |
        Um evento do fluxo do admin depois de lido (campos `id`, `event` e `data` do SSE). Só o
        `notification.created` do titular e o `ping`; os demais tipos do canal são descartados
        (ADR 0028).
      oneOf:
        - $ref: "#/components/schemas/StreamEventNotificationCreated"
        - $ref: "#/components/schemas/StreamEventPing"
      discriminator:
        propertyName: event
        mapping:
          notification.created: "#/components/schemas/StreamEventNotificationCreated"
          ping: "#/components/schemas/StreamEventPing"
    JobType:
      type: string
      pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
      description: |
        Tipo da tarefa (`specs/005-worker-e-fila.md`), no formato `palavra.palavra` em minúsculas.
        Fica em texto, e não em `enum`, porque o worker pode ganhar tipo que esta API ainda não
        conhece.
      examples: [email.send, retention.purge]
    OpsJobStatus:
      type: string
      enum: [queued, running, failed]
      description: |
        Estado da tarefa na tela de operação: pendente, em execução ou com falha. Tarefas
        concluídas não aparecem.
    OpsJob:
      type: object
      description: |
        Uma tarefa da fila (`specs/005-worker-e-fila.md`, "Dados"). `payload` e dados de trava não
        saem; `lastError` já vem mascarado pelo worker.
      required:
        [id, type, status, priority, attempts, maxAttempts, runAt, createdAt, finishedAt, lastError]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/OpsJobStatus"
        priority:
          type: integer
          description: Prioridade; maior executa antes.
        attempts:
          type: integer
          minimum: 0
          description: Tentativas já gastas; sobe quando o worker pega a tarefa.
        maxAttempts:
          type: integer
          minimum: 1
        runAt:
          $ref: "#/components/schemas/DateTime"
          description: Quando pode executar (ou voltar a executar).
        createdAt:
          $ref: "#/components/schemas/DateTime"
        finishedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim da última execução; nulo enquanto não terminou.
        lastError:
          type: [string, "null"]
          description: Motivo da última falha, mascarado; `null` quando nunca falhou.
      additionalProperties: false
    OpsJobPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OpsJob"
    OpsEmailStatus:
      type: string
      enum: [queued, failed]
      description: Estado do e-mail na tela de operação; enviados não aparecem.
    OpsEmail:
      type: object
      description: |
        Uma linha de `email_outbox` ainda não enviada (`specs/024-notificacoes-e-email.md`,
        "E-mail"). O destinatário sai mascarado e o corpo renderizado não é guardado.
      required: [id, type, to, subject, status, attempts, lastError, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
          description: Tipo do e-mail, no mesmo formato dos códigos do catálogo.
          examples: [ticket.reply]
        to:
          type: string
          description: Destinatário mascarado (por exemplo `a***@exemplo.com`).
        subject:
          type: [string, "null"]
          description: Assunto; nulo até o envio montar o e-mail.
        status:
          $ref: "#/components/schemas/OpsEmailStatus"
        attempts:
          type: integer
          minimum: 0
          description: Tentativas já gastas.
        lastError:
          type: [string, "null"]
          description: Motivo da última falha do SMTP; `null` quando nunca falhou.
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    OpsEmailPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OpsEmail"
    OpsJobTypeSummary:
      type: object
      description: Contagem da fila por tipo, para o resumo e o selo do menu.
      required: [type, queued, running, failed, oldestPendingSeconds]
      properties:
        type:
          $ref: "#/components/schemas/JobType"
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        oldestPendingSeconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
          description: |
            Idade, em segundos, da tarefa pendente mais antiga deste tipo; nulo quando não há
            nenhuma.
      additionalProperties: false
    OpsSummary:
      type: object
      description: |
        Números da tela "Operação" e do selo do menu
        (`specs/033-observabilidade-retencao-backup.md`, "Tela Operação").
      required: [jobs, emails, webhooks, system, failures]
      properties:
        jobs:
          type: array
          description: A fila por tipo, com pendentes, em execução e com falha.
          items:
            $ref: "#/components/schemas/OpsJobTypeSummary"
        emails:
          type: object
          required: [queued, failed]
          properties:
            queued:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
          additionalProperties: false
        webhooks:
          type: object
          required: [failed]
          properties:
            failed:
              type: integer
              minimum: 0
              description: Eventos de webhook com falha de processamento, reprocessáveis.
          additionalProperties: false
        system:
          $ref: "#/components/schemas/OpsSystemSummary"
        failures:
          type: integer
          minimum: 0
          description: |
            Soma do que o selo do menu mostra: tarefas, e-mails e webhooks com falha. Zero
            significa nenhuma falha.
      additionalProperties: false
    OpsSystemSummary:
      type: object
      description: |
        Bloco "Sistema" da tela de operação (`specs/033-observabilidade-retencao-backup.md`).
        Cifras em bytes.
      required: [version, migrationVersion, databaseBytes, imageBytes, lastBackup, lastPurgeAt]
      properties:
        version:
          type: string
          description: Versão instalada do nuva-edu (SemVer).
          examples: [0.1.0]
        migrationVersion:
          type: string
          description: Última migration aplicada.
          examples: ["0019"]
        databaseBytes:
          type: integer
          minimum: 0
        imageBytes:
          type: integer
          minimum: 0
          description: Espaço ocupado pelas imagens das variantes (`specs/029-imagens.md`).
        lastBackup:
          oneOf:
            - type: object
              required: [finishedAt, sizeBytes, status]
              properties:
                finishedAt:
                  $ref: "#/components/schemas/DateTime"
                sizeBytes:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum: [ok, failed]
              additionalProperties: false
            - type: "null"
          description: |
            Última execução de backup; nulo quando ainda não houve. Mais de 26 horas desde
            `finishedAt` aparece como atrasado.
        lastPurgeAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim do último expurgo (`retention.purge`); nulo quando ainda não houve.
      additionalProperties: false
    SchoolBranding:
      type: object
      description: |
        Identidade da escola usada nos e-mails de notificação
        (`specs/024-notificacoes-e-email.md`, "E-mail"). Todos os campos estão sempre presentes;
        `logoUrl`, `accentColor` e `footer` podem ser `null`.
      required: [schoolName, logoUrl, accentColor, footer]
      properties:
        schoolName:
          type: string
          description: Nome da escola, o mesmo do `/meta`.
        logoUrl:
          type: [string, "null"]
          format: uri-reference
          description: Caminho do logotipo na própria API, ou nulo sem logotipo.
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/256.webp, null]
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Cor de destaque em `#RRGGBB`, ou nulo para a cor padrão da interface.
          examples: ["#1F6FEB", null]
        footer:
          type: [string, "null"]
          maxLength: 500
          description: Rodapé dos e-mails, com quebras de linha; nulo quando não definido.
      additionalProperties: false
    SchoolBrandingInput:
      type: object
      description: |
        Os quatro campos gravados juntos; `logoImageId` é o identificador da imagem do logotipo
        (`specs/029-imagens.md`), não o caminho.
      required: [schoolName, logoImageId, accentColor, footer]
      properties:
        schoolName:
          type: string
          minLength: 1
          maxLength: 120
        logoImageId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
        footer:
          type: [string, "null"]
          maxLength: 500
      additionalProperties: false

