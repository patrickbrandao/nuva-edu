      tags: [settings]
      summary: Identidade da escola nos e-mails
      x-permission: settings.manage
      description: |
        Nome, logotipo, cor de destaque e rodapé usados nos e-mails de notificação
        (`specs/024-notificacoes-e-email.md`, "E-mail"). O admin edita só a identidade; os
