        version:
          $ref: "#/components/schemas/CatalogVersion"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleItem"
        itemsPriceCents:
          type: integer
          minimum: 0
          description: Soma dos preços avulsos dos itens `paid`, para mostrar a economia.
        studentCount:
          type: integer
          minimum: 0
          description: Alunos com direito ativo ao produto, para os avisos de despublicar e de remover item.
      additionalProperties: false
    BundleCreate:
      type: object
      required: [title]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, "null"]
          maxLength: 300
        description:
          type: [string, "null"]
          maxLength: 20000
          description: Markdown, exibido sanitizado.
        coverImageId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Imagem `product_cover` enviada antes por `POST /api/v1/images`; `null` remove.
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        priceCents:
          type: [integer, "null"]
