openapi: 3.1.0
info:
  title: nuva-edu admin-api
  version: 0.1.0
  summary: API do site de administração.
  description: |
    Contrato da `admin-api`, escrito à mão e anterior ao código (ADR 0009). O Fastify valida
    requisições e respostas contra este arquivo, e o cliente de `packages/api-client` é gerado dele.
    Comportamento: `specs/003-admin-api.md`.

    **Caminhos e prefixo.** O servidor é a origem do site (`/`) e cada caminho aparece completo,
    igual à rota registrada no serviço. As rotas de negócio ficam sob `/api/v1`; `/healthz` e
    `/readyz` ficam na raiz, fora do prefixo, porque são sondas do processo e não fazem parte da
    versão da API. `/metrics` (texto Prometheus, só rede interna) não é descrita aqui.

    **Convenções.** JSON em UTF-8, campos em `camelCase`, datas ISO 8601 em UTC, dinheiro em
    centavos inteiros. Erros em `application/problem+json` (RFC 9457) com `code` estável; os
    códigos gerais estão no esquema `Problem` e em `specs/003-admin-api.md`.
    Listagens paginadas por cursor (`limit`, `cursor`) com resposta `{ items, nextCursor }`:
    cada listagem compõe `Page` por `allOf` e declara o próprio `items` (ver o esquema `Page`).
    Toda resposta traz `X-Request-Id`.

    **Sessão.** Cookie `nuva_admin_session` (HttpOnly, Secure, SameSite=Lax).

    **CSRF.** Toda operação que altera dados exige, além do cookie, o cabeçalho `X-CSRF-Token`
    com o token devolvido em `GET /api/v1/session`; sem ele, ou com valor diferente, a resposta
    é `403` com `code: csrf_token_invalid`. No contrato a exigência é o esquema de segurança
    `csrfToken`, declarado junto de `sessionCookie` no `security` de cada operação de escrita, e
    não um parâmetro de cabeçalho: é uma credencial da sessão, igual em todas as escritas, que o
    cliente de `packages/api-client` preenche sozinho. Como parâmetro obrigatório, o tipo gerado
    cobraria o cabeçalho em cada chamada; como parâmetro opcional, o contrato diria que a API
    aceita escrita sem ele. Operação de escrita sem `csrfToken` no `security` é exceção e diz o
    motivo na própria descrição.

    **Componentes comuns.** Os esquemas, parâmetros, cabeçalhos, respostas e o esquema de
    segurança `csrfToken`, marcados como
    "comum" em `components` são idênticos nos contratos da `admin-api` e da `classroom-api`;
    mudança em um é feita nos dois.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Mesma origem do site (uso normal; o site só chama a API do próprio endereço).
  - url: "{scheme}://{host}"
    description: Endereço explícito de uma instalação.
    variables:
      scheme:
        enum: [http, https]
        default: https
      host:
        default: edu-admin.localhost:8080
        description: Valor de `NUVA_ADMIN_HOST`, com a porta quando não for 80/443.
tags:
  - name: health
    description: Sondas do processo, fora de `/api/v1`.
  - name: meta
    description: Dados públicos da instalação.
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Processo vivo
      description: |
        Responde sem tocar no banco. Usada pelo `healthcheck` do Docker.
      security: []
      responses:
        "200":
          description: O processo responde.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Pronto para atender
      description: |
        Confere a conexão com o banco e se as migrations estão na versão esperada. Não é roteada
        pelo proxy: serve ao `depends_on` do Compose e ao diagnóstico.
      security: []
      responses:
        "200":
          description: Pronto.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Não pronto; `checks` indica o que falhou.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Dados públicos da instalação
      description: |
        Nome da escola, versão, moeda, idioma e provedores de login social ativos. Não exige sessão.
      security: []
      responses:
        "200":
          description: Dados da instalação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuva_admin_session
      description: |
        Identificador opaco da sessão (`specs/007-contas-e-autenticacao.md`). Vale só neste site.
    # --- comum ---
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Token CSRF da sessão, devolvido em `GET /api/v1/session`. Exigido, junto com
        `sessionCookie`, em toda operação que altera dados:

        ```yaml
        security:
          - sessionCookie: []
            csrfToken: []
        ```

        Os dois na mesma entrada da lista, porque ambos são exigidos. Cabeçalho ausente ou
        diferente do token da sessão: `403` com `code: csrf_token_invalid`. Não existe parâmetro
        de cabeçalho para ele; o cliente gerado o preenche sozinho nas requisições que não são
        `GET`, `HEAD`, `OPTIONS` ou `TRACE`.
  parameters:
    # --- comum ---
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` da página anterior. Ausente na primeira página.
      schema:
        $ref: "#/components/schemas/Cursor"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Chave escolhida pelo cliente; a repetição devolve a primeira resposta por 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    # --- comum ---
    XRequestId:
      description: Identificador da requisição, o mesmo que aparece nos logs.
      schema:
        type: string
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
        minimum: 0
  responses:
    # --- comum ---
    BadRequest:
      description: Requisição inválida; `errors` lista os campos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Sem sessão válida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Sem permissão para a operação (`permission_denied`), escrita sem `X-CSRF-Token` válido
        (`csrf_token_invalid`) ou outra recusa de acesso com `code` próprio.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente ou fora do alcance de quem pede.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado, com `code` próprio (por exemplo, `version_conflict`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Regra de negócio impede a operação; o `code` é o da regra.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Limite de taxa atingido (`rate_limited`); `retryAfterSeconds` repete o `Retry-After`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Erro inesperado (`internal_error`), sem `detail`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência indisponível (banco ou provedor externo).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    # --- comum ---
    Uuid:
      type: string
      format: uuid
      description: Identificador de recurso.
      examples: [0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70]
    DateTime:
      type: string
      format: date-time
      description: Instante em ISO 8601, sempre em UTC (sufixo `Z`).
      examples: ["2026-11-24T13:45:00Z"]
    Date:
      type: string
      format: date
      description: Data de calendário em ISO 8601, sem hora.
      examples: ["2026-11-24"]
    Cursor:
      type: string
      minLength: 1
      description: Cursor opaco de paginação; o cliente só o devolve como recebeu.
    MoneyCents:
      type: integer
      description: Valor em centavos inteiros, na moeda da instalação.
      examples: [19900]
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Moeda da instalação em ISO 4217 (`NUVA_CURRENCY`).
      examples: [BRL]
    Locale:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      description: Idioma em BCP 47 (`NUVA_LOCALE`).
      examples: [pt-BR]
    Page:
      type: object
      description: |
        Parte comum da resposta de listagem paginada por cursor. Traz só `nextCursor`: cada
        listagem a compõe com `allOf` e declara `items`, obrigatório, no próprio membro, com o
        esquema dos itens:

        ```yaml
        UserPage:
          allOf:
            - $ref: "#/components/schemas/Page"
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
        ```

        `items` não é declarado aqui porque a interseção de um `items` genérico com o da
        listagem tiparia o cliente gerado como `unknown[] & User[]`. Nem este esquema nem o
        membro da listagem usam `additionalProperties: false`, que invalidaria a composição.
      required: [nextCursor]
      properties:
        nextCursor:
          description: Cursor da próxima página; `null` na última.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
    ProblemFieldError:
      type: object
      description: Um campo recusado na validação.
      required: [path, message]
      properties:
        path:
          type: string
          description: Caminho do campo na requisição.
          examples: [body.email]
        message:
          type: string
    Problem:
      type: object
      description: |
        Erro no formato RFC 9457. Pode trazer campos extras conforme o `code`; os comuns estão
        declarados aqui (`errors`, `retryAfterSeconds`).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifica o tipo do problema; `about:blank` quando não há página própria.
          default: about:blank
        title:
          type: string
          description: Resumo curto, igual para todas as ocorrências do tipo.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: O mesmo código de status da resposta HTTP.
        detail:
          type: string
          description: Explicação desta ocorrência.
        instance:
          type: string
          format: uri-reference
          description: Caminho da requisição que falhou.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Identificador estável do erro, para o cliente decidir o que fazer. A lista é aberta:
            um `code` só muda ou some com mudança de versão da API, e código novo pode surgir.

            Códigos gerais, iguais nas duas APIs (`specs/003-admin-api.md`):

            | `code` | Status | Quando |
            | --- | --- | --- |
            | `validation_failed` | 400 | Requisição fora do contrato; `errors` lista os campos |
            | `unauthenticated` | 401 | Sem sessão válida |
            | `permission_denied` | 403 | Sessão válida, sem permissão para a operação |
            | `csrf_token_invalid` | 403 | Escrita sem `X-CSRF-Token` ou com token diferente do da sessão |
            | `not_found` | 404 | Recurso inexistente ou fora do alcance de quem pede |
            | `version_conflict` | 409 | `version` enviada diferente da gravada |
            | `rate_limited` | 429 | Limite de taxa; traz `retryAfterSeconds` |
            | `internal_error` | 500 | Erro inesperado; sem `detail` |
            | `database_unavailable` | 503 | Banco indisponível |
            | `payment_provider_unavailable` | 503 | Provedor de pagamento indisponível |

            Os demais `403`, `409`, `422` e `503` usam um código próprio da regra, definido na
            spec do recurso e citado na descrição da operação (por exemplo, `entitlement_required`).
          examples: [permission_denied, validation_failed, database_unavailable]
        errors:
          type: array
          description: Presente em erro de validação (`400`).
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: |
            Segundos até poder tentar de novo; o mesmo valor do cabeçalho `Retry-After`.
            Presente em `rate_limited` (`429`).
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    ReadinessCheck:
      type: string
      enum: [ok, fail]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, migrations]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Conexão com o PostgreSQL.
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Banco na versão de migration esperada pelo serviço.
          additionalProperties: false
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, facebook, apple]
      description: Provedor de login social.
    Meta:
      type: object
      required: [schoolName, version, currency, locale, authProviders]
      properties:
        schoolName:
          type: string
          description: Nome da escola, definido na configuração do admin.
        version:
          type: string
          description: Versão instalada do nuva-edu (SemVer).
          examples: [0.1.0]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        locale:
          $ref: "#/components/schemas/Locale"
        authProviders:
          type: array
          description: |
            Provedores de login social configurados nesta instalação; vazio quando nenhum.
            Login por e-mail e senha está sempre disponível e não aparece na lista.
          items:
            $ref: "#/components/schemas/AuthProvider"
          uniqueItems: true
      additionalProperties: false
