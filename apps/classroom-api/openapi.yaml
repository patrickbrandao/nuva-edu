  /api/v1/lessons/{id}/progress:
    put:
      operationId: saveLessonProgress
      tags: [learning]
      summary: Marcar conclusão e gravar a posição do vídeo
      x-permission: learning.track
      description: |
        Grava só os campos enviados (`specs/014-aprendizado-e-progresso.md`). `completed: true` conclui
        (idempotente; `completedVia` diz se foi pelo botão ou pelo fim do vídeo); `false` desmarca.
        `positionSeconds` é enviado no máximo a cada 15 s e ao sair da página, por `fetch` com
        `keepalive` e `X-CSRF-Token`. A passagem de menos de 100% a 100% enfileira `course.completed`
        na mesma transação.

        - Sem acesso à aula: `403` `access_denied` com `reason`. Aula despublicada ou inexistente:
          `404`.
        - `positionSeconds` negativo ou acima da duração + 60 s: `422` `position_out_of_range`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                completed:
                  type: boolean
                completedVia:
                  $ref: "#/components/schemas/CompletionVia"
                  description: "Obrigatório com `completed: true`; ignorado nos demais."
                positionSeconds:
                  type: [number, "null"]
                  description: Posição do vídeo, em segundos.
              additionalProperties: false
              minProperties: 1
      responses:
        "200":
          description: Progresso gravado.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgressResult"
        "400":
