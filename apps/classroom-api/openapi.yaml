                  minLength: 3
                  maxLength: 40
                  pattern: "^[A-Za-z0-9-]+$"
              additionalProperties: false
      responses:
        "200":
          description: Cupom aplicado; a resposta é a cesta recalculada.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
