  /api/v1/images/{imageId}/{variant}.webp:
    get:
      operationId: getImageVariant
      tags: [images]
      summary: Entrega de uma variante de imagem
      description: |
        Entrega pública de uma variante (`specs/029-imagens.md`, "Entrega"), sem sessão: o
        identificador é um UUID que não se adivinha. As duas APIs servem a mesma rota.

        - `Cache-Control: public, max-age=31536000, immutable` e `ETag` com o hash do conteúdo;
          `If-None-Match` igual ao `ETag` responde `304`.
        - Imagem inexistente, ocultada pela moderação ou largura que a finalidade não tem: `404`.
      security: []
      parameters:
        - $ref: "#/components/parameters/ImageIdPath"
        - $ref: "#/components/parameters/ImageVariantPath"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ImageVariant"
        "304":
          $ref: "#/components/responses/ImageNotModified"
        "400":
