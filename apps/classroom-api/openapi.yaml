      required: [date, total, lessonsCompleted, forumPosts, communityActions, level]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        total:
          type: integer
          minimum: 1
        lessonsCompleted:
          type: integer
          minimum: 0
        forumPosts:
          type: integer
          minimum: 0
        communityActions:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          maximum: 4
          description: Intensidade do quadrado (0 é o dia sem atividade, fora da lista).
      additionalProperties: false
    ActivityMap:
      type: object
      required: [timezone, from, to, days]
      properties:
        timezone:
          type: string
          description: Fuso IANA usado no cálculo dos dias.
        from:
          $ref: "#/components/schemas/Date"
        to:
          $ref: "#/components/schemas/Date"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ActivityDay"
      additionalProperties: false
    MyEbook:
      type: object
      required: [id, slug, title, cover, authorName, pages, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        authorName:
          type: [string, "null"]
        pages:
          type: [integer, "null"]
          minimum: 1
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Fim do acesso; `null` é vitalício.
      additionalProperties: false
    MyEbookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyEbook"
      additionalProperties: false
    NoteLesson:
      type: object
      description: A aula de uma nota, para o link de volta.
      required: [id, title, courseId, courseSlug, courseTitle, available]
      properties:
        id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: "`null` quando a aula foi excluída."
        title:
          type: string
          description: |
            Título atual enquanto `available`; o guardado na criação da nota quando a aula está
            despublicada, o curso despublicado ou arquivado, ou a aula foi excluída. `courseTitle`
            segue a mesma regra.
        courseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        courseSlug:
          type: [string, "null"]
        courseTitle:
          type: string
        available:
          type: boolean
          description: |
            Falso com a aula despublicada ou excluída, ou o curso despublicado ou arquivado: a nota
            não tem link de volta. Verdadeiro não garante acesso: o link pode levar à tela de "sem
            acesso" da aula.
      additionalProperties: false
    Note:
      type: object
      description: Uma nota, privada do dono.
      required: [id, lesson, videoSeconds, title, body, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        lesson:
          oneOf:
            - $ref: "#/components/schemas/NoteLesson"
            - type: "null"
          description: "`null` na nota avulsa."
        videoSeconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
        title:
          type: [string, "null"]
        body:
          type: string
          description: Markdown.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    NoteSummary:
      type: object
      required: [id, lesson, videoSeconds, title, excerpt, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        lesson:
          oneOf:
            - $ref: "#/components/schemas/NoteLesson"
            - type: "null"
        videoSeconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
        title:
          type: [string, "null"]
        excerpt:
          type: string
          description: Início do corpo, sem Markdown, até 300 caracteres.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    NoteSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NoteSummary"
    NoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Note"
      additionalProperties: false
    NoteConflictProblem:
      description: |
        `Problem` de `409` `version_conflict`, com a versão gravada da nota em `current`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            current:
              $ref: "#/components/schemas/Note"
    MyCertificate:
      type: object
      required:
        [
          id,
          code,
          state,
          course,
          courseTitle,
          studentName,
          hours,
          completedAt,
          issuedAt,
          revokedAt,
          validationUrl,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          description: Código com hífens.
        state:
          $ref: "#/components/schemas/CertificateState"
        course:
          type: object
          required: [id, slug, title]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            slug:
              $ref: "#/components/schemas/Slug"
            title:
              type: string
          additionalProperties: false
        courseTitle:
          type: string
          description: Título congelado na emissão.
        studentName:
          type: string
          description: Nome congelado na emissão.
        hours:
          type: integer
          minimum: 0
        completedAt:
          $ref: "#/components/schemas/DateTime"
        issuedAt:
          $ref: "#/components/schemas/DateTime"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        validationUrl:
          type: string
          format: uri
          description: Página pública de validação (`/certificados/<código>`).
      additionalProperties: false
    AwaitingCertificate:
      type: object
      required: [course, completedAt]
      properties:
        course:
          type: object
          required: [id, slug, title]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            slug:
              $ref: "#/components/schemas/Slug"
            title:
              type: string
          additionalProperties: false
        completedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    MyCertificates:
      type: object
      required: [studentName, items, awaitingTemplate]
      properties:
        studentName:
          type: string
          description: O nome que sairá nos próximos certificados.
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyCertificate"
        awaitingTemplate:
          type: array
          description: Cursos concluídos cujo certificado ainda não foi liberado pelo instrutor.
          items:
            $ref: "#/components/schemas/AwaitingCertificate"
      additionalProperties: false
    CertificateName:
      type: object
      required: [fullName, studentName]
      properties:
        fullName:
          type: [string, "null"]
        studentName:
          type: string
          description: O nome que sairá no certificado.
      additionalProperties: false
    CertificateVerificationStatus:
      type: string
      enum: [valid, revoked, holder_removed]
      description: "`holder_removed`: o titular excluiu a conta; o nome não aparece."
    CertificateVerification:
      type: object
      description: |
        Resultado da validação pública. Revogado mostra só o estado e a data, sem o motivo.
      required:
        [
          status,
          code,
          studentName,
          courseTitle,
          hours,
          completedAt,
          issuedAt,
          schoolName,
          revokedAt,
        ]
      properties:
        status:
          $ref: "#/components/schemas/CertificateVerificationStatus"
        code:
          type: string
        studentName:
          type: [string, "null"]
          description: Só em `valid`.
        courseTitle:
          type: [string, "null"]
          description: Em `valid` e `holder_removed`.
        hours:
          type: [integer, "null"]
          minimum: 0
          description: Só em `valid`.
        completedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Em `valid` e `holder_removed`.
        issuedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Em `valid` e `holder_removed`.
        schoolName:
          type: [string, "null"]
          description: Só em `valid`.
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Só em `revoked`.
      additionalProperties: false
    # --- só classroom-api: vendas e pagamentos (Fase 3) ---
    TaxIdType:
      type: string
      enum: [cpf, cnpj]
      description: Tipo do documento fiscal do comprador (`specs/011-vendas-e-checkout.md`).
    PaymentProviderName:
      type: string
      enum: [mercadopago, fake, none]
      description: |
        Provedor de pagamento do pedido ou da cobrança (`NUVA_PAYMENT_PROVIDER`); `none` no pedido de
        total zero, que não passa pelo provedor.
    PaymentStatus:
      type: string
      enum: [pending, approved, rejected, canceled, refunded, partially_refunded, charged_back]
      description: Estado normalizado da cobrança no provedor (`specs/013-pagamentos-mercado-pago.md`).
    PaymentMethod:
      type: string
      enum: [card, pix, boleto, other]
      description: Meio de pagamento informado pelo provedor; `other` quando não é um dos três.
    OrderStatus:
      type: string
      enum: [pending, paid, partially_refunded, refunded, canceled, expired, chargeback]
      description: |
        Estado do pedido do comprador (`specs/011-vendas-e-checkout.md`, "Pedido e seus estados").
        `draft` não aparece aqui: é resto de tentativa que não chegou ao provedor e não é pedido do
        aluno. `chargeback` revoga o acesso.
    CartItemWarning:
      type: string
      enum: [bundle_item_owned, subscription_covered, time_limited_access]
      description: |
        Aviso que não bloqueia a compra (`specs/011-vendas-e-checkout.md`, "Cesta"):
        `bundle_item_owned` (o aluno já tem um dos itens do pacote), `subscription_covered` (o
        produto já é coberto por assinatura ativa; o avulso sobrevive ao fim dela) ou
        `time_limited_access` (o aluno já tem o produto com validade; a compra estende o acesso).
    CartItemUnsellableReason:
      type: string
      enum: [unpublished, archived, not_paid]
      description: |
        Por que o item não pode ser comprado agora: despublicado, arquivado ou fora do modo `paid`.
        O item continua na cesta para o aluno decidir entre remover ou esperar a republicação.
    CartUnlockVia:
      type: object
      description: Produto de onde o direito em cascata vem, para explicar a árvore na cesta.
      required: [productType, title]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        title:
          type: string
      additionalProperties: false
    CartUnlock:
      type: object
      description: Produto que a compra do item libera, além do próprio item (`specs/010-direitos-de-acesso.md`, "Algoritmo de concessão").
      required: [productType, productId, title, via]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        via:
          oneOf:
            - $ref: "#/components/schemas/CartUnlockVia"
            - type: "null"
          description: |
            Curso do pacote de onde vem o ebook, quando é o caso; `null` para o próprio item e para
            os filhos diretos dele (cursos e ebooks do pacote, ebooks do curso).
      additionalProperties: false
    CartItem:
      type: object
      description: Um produto na cesta, com o preço atual e o que a compra libera.
      required:
        [
          id,
          productType,
          productId,
          title,
          cover,
          accessMode,
          accessDays,
          unitPriceCents,
          discountCents,
          couponEligible,
          sellable,
          unsellableReason,
          warnings,
          unlocks,
          addedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso a partir da compra; `null` é vitalício.
        unitPriceCents:
          type: [integer, "null"]
          minimum: 0
          description: Preço atual do produto; `null` quando o produto deixou de ter preço.
        discountCents:
          type: integer
          minimum: 0
          description: |
            Parte do desconto do cupom rateada neste item, pela regra de `specs/011-vendas-e-checkout.md`
            ("Cupons"); zero sem cupom válido ou com item fora da restrição de produtos.
        couponEligible:
          type: boolean
          description: O cupom aplicado vale para este produto.
        sellable:
          type: boolean
          description: O item pode ser comprado agora.
        unsellableReason:
          oneOf:
            - $ref: "#/components/schemas/CartItemUnsellableReason"
            - type: "null"
          description: "`null` quando `sellable`."
        warnings:
          type: array
          description: Avisos que não impedem a compra; vazio quando não há.
          items:
            $ref: "#/components/schemas/CartItemWarning"
        unlocks:
          type: array
          description: |
            O que a compra libera além do item, na ordem do algoritmo de concessão; vazio em ebook.
          items:
            $ref: "#/components/schemas/CartUnlock"
        addedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    CartCoupon:
      type: object
      description: Cupom aplicado à cesta, com o estado atual da validade.
      required: [code, kind, percentOff, amountOffCents, valid, invalidReason]
      properties:
        code:
          type: string
        kind:
          type: string
          enum: [percent, fixed]
        percentOff:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
        amountOffCents:
          type: [integer, "null"]
          minimum: 1
        valid:
          type: boolean
          description: O cupom ainda vale para esta cesta; quando falso, nenhum desconto é aplicado.
        invalidReason:
          oneOf:
            - type: string
              enum: [expired, exhausted, inactive, not_eligible]
            - type: "null"
          description: "`null` quando `valid`."
      additionalProperties: false
    Cart:
      type: object
      description: A cesta aberta do aluno.
      required:
        [items, coupon, itemCount, subtotalCents, discountCents, totalCents, currency, updatedAt]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CartItem"
        coupon:
          oneOf:
            - $ref: "#/components/schemas/CartCoupon"
            - type: "null"
          description: "`null` sem cupom aplicado."
        itemCount:
          type: integer
          minimum: 0
          maximum: 50
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    Billing:
      type: object
      description: Dados de comprador guardados no usuário (`specs/011-vendas-e-checkout.md`, "Dados do comprador").
      required: [fullName, taxIdType, taxId, complete]
      properties:
        fullName:
          type: [string, "null"]
        taxIdType:
          oneOf:
            - $ref: "#/components/schemas/TaxIdType"
            - type: "null"
        taxId:
          type: [string, "null"]
          description: Só os caracteres do documento, sem pontuação; nunca vai para logs.
        complete:
          type: boolean
          description: Nome e documento válidos guardados; a finalização exige `true`.
      additionalProperties: false
    OrderProductRef:
      type: object
      description: Um item do pedido, só com o necessário para a lista.
      required: [productType, productId, title]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          description: Título congelado no fechamento do pedido.
      additionalProperties: false
    OrderItem:
      type: object
      description: Um item do pedido, com os valores congelados no fechamento.
      required:
        [
          id,
          productType,
          productId,
          title,
          accessDays,
          unitPriceCents,
          discountCents,
          paidCents,
          refundedCents,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        productType:
          $ref: "#/components/schemas/ProductType"
        productId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso congelados; `null` é vitalício.
        unitPriceCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        paidCents:
          $ref: "#/components/schemas/MoneyCents"
          description: Preço menos o desconto rateado; o valor efetivamente pago.
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
      additionalProperties: false
    MyPayment:
      type: object
      description: A cobrança conhecida do pedido (a mais recente).
      required:
        [method, status, amountCents, refundedCents, currency, provider, providerPaymentId, paidAt]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amountCents:
          $ref: "#/components/schemas/MoneyCents"
        refundedCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        provider:
          type: string
          enum: [mercadopago, fake]
        providerPaymentId:
          type: string
          description: Identificador da cobrança no provedor; serve de comprovante junto da página dele.
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
      additionalProperties: false
    MyOrderSummary:
      type: object
      description: Um pedido do aluno na lista.
      required:
        [
          id,
          number,
          status,
          itemCount,
          items,
          subtotalCents,
          discountCents,
          totalCents,
          currency,
          createdAt,
          paidAt,
          expiresAt,
          paymentMethod,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: integer
          minimum: 1
          description: Número legível e sequencial do pedido, com saltos aceitos.
        status:
          $ref: "#/components/schemas/OrderStatus"
        itemCount:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderProductRef"
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Prazo do `pending`; `null` fora dele.
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
          description: Meio da cobrança conhecida; `null` antes da primeira cobrança.
      additionalProperties: false
    MyOrderPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MyOrderSummary"
    MyOrderDetail:
      type: object
      description: O pedido do aluno, com os valores congelados e a cobrança conhecida.
      required:
        [
          id,
          number,
          status,
          subtotalCents,
          discountCents,
          totalCents,
          currency,
          couponCode,
          buyerName,
          buyerTaxIdType,
          buyerTaxId,
          provider,
          checkoutUrl,
          createdAt,
          paidAt,
          expiresAt,
          items,
          payment,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        number:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/OrderStatus"
        subtotalCents:
          $ref: "#/components/schemas/MoneyCents"
        discountCents:
          $ref: "#/components/schemas/MoneyCents"
        totalCents:
          $ref: "#/components/schemas/MoneyCents"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        couponCode:
          type: [string, "null"]
          description: Código do cupom congelado no pedido; `null` sem cupom.
        buyerName:
          type: string
        buyerTaxIdType:
          $ref: "#/components/schemas/TaxIdType"
        buyerTaxId:
          type: string
          description: Documento do próprio comprador, sem pontuação; nunca vai para logs.
        provider:
          $ref: "#/components/schemas/PaymentProviderName"
        checkoutUrl:
          type: [string, "null"]
          format: uri
          description: |
            Página de pagamento do provedor enquanto o pedido está `pending` e o provedor não é
            `none`; `null` depois de pago, reembolsado, cancelado, expirado ou em pedido de total
            zero. Com Checkout Pro, Pix e boleto são pagos nessa página: a API não recebe QR nem
            código de barras.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        paidAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Prazo do `pending` (30 min no cartão e no Pix, 3 dias no boleto); `null` fora dele.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          oneOf:
            - $ref: "#/components/schemas/MyPayment"
            - type: "null"
          description: "`null` até a primeira cobrança ser conhecida."
      additionalProperties: false
    OrderCheckout:
      type: object
      description: Resultado de fechar a cesta.
      required: [order, checkoutUrl]
      properties:
        order:
          $ref: "#/components/schemas/MyOrderDetail"
        checkoutUrl:
          type: [string, "null"]
          format: uri
          description: |
            Para onde o navegador vai pagar; `null` no pedido de total zero, já `paid` com
            `provider: none`.
      additionalProperties: false
