          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createNote
      tags: [notes]
      summary: Criar nota
      x-permission: learning.track
      description: |
        Nota de aula (com `lessonId`) ou avulsa (sem). Nota de aula exige acesso à aula no momento:
        `403` `access_denied` com `reason`; aula inexistente ou despublicada: `404`. Título sem os
        espaços das pontas; só espaços vira `null`; acima de 160: `400`.

        `422`, pelo `code`: `note_empty` (corpo só com espaços); `note_too_long` (acima de 20.000
        caracteres); `note_limit_reached` (o usuário já tem 5.000 notas); `note_lesson_limit_reached`
        (já tem 100 notas nesta aula); `note_video_seconds_invalid` (`videoSeconds` negativo, não
        finito, acima de 2.147.483.647, ou enviado em nota avulsa).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                lessonId:
                  oneOf:
                    - $ref: "#/components/schemas/Uuid"
                    - type: "null"
                title:
                  type: [string, "null"]
                  maxLength: 160
                body:
                  type: string
                  minLength: 1
                  description: Markdown, até 20.000 caracteres.
                videoSeconds:
                  type: [number, "null"]
                  description: |
                    Instante do vídeo em segundos, só em nota de aula. A fração é descartada (`83.9`
                    vira `83`). Inválido: `422` `note_video_seconds_invalid`.
              additionalProperties: false
      responses:
        "201":
          description: Nota criada.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
