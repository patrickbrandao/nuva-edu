          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuva_classroom_session
      description: |
        Identificador opaco da sessão (`specs/007-contas-e-autenticacao.md`). Vale só neste site.
    # --- comum ---
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Token CSRF da sessão, devolvido em `GET /api/v1/session`. Exigido, junto com
        `sessionCookie`, em toda operação que altera dados:

        ```yaml
        security:
          - sessionCookie: []
            csrfToken: []
        ```

        Os dois na mesma entrada da lista, porque ambos são exigidos. Cabeçalho ausente ou
        diferente do token da sessão: `403` com `code: csrf_token_invalid`. Não existe parâmetro
        de cabeçalho para ele; o cliente gerado o preenche sozinho nas requisições que não são
        `GET`, `HEAD`, `OPTIONS` ou `TRACE`.
  parameters:
    # --- comum ---
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` da página anterior. Ausente na primeira página.
      schema:
        $ref: "#/components/schemas/Cursor"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Chave escolhida pelo cliente; a repetição devolve a primeira resposta por 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        $ref: "#/components/schemas/Uuid"
    AuthProviderPath:
      name: provider
      in: path
      required: true
      description: |
        Provedor de login social. Provedor sem as variáveis configuradas nesta instalação (fora de
        `authProviders` em `GET /api/v1/meta`) responde `404`.
      schema:
        $ref: "#/components/schemas/AuthProvider"
    ReturnTo:
      name: returnTo
      in: query
      description: |
        Caminho do próprio site para onde o navegador volta depois do login (começa com `/`, não
        com `//`). Outro valor, ou ausente, vira `/`; nunca é recusado.
      schema:
        type: string
        maxLength: 2048
    ImageIdPath:
      name: imageId
      in: path
      required: true
      description: Identificador da imagem.
      schema:
        $ref: "#/components/schemas/Uuid"
    ImageVariantPath:
      name: variant
      in: path
      required: true
      description: |
        Largura da variante, em pixels. Cada imagem só tem as variantes da sua finalidade
        (`specs/029-imagens.md`, "Finalidades e variantes"); outra largura responde `404`.
      schema:
        $ref: "#/components/schemas/ImageVariantWidth"
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        `ETag` de uma entrega anterior. Igual ao atual, a resposta é `304`, sem corpo.
      schema:
        type: string
    # --- só classroom-api ---
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        `id` do último evento recebido; o navegador o envia sozinho ao reconectar. Valor que não
        é um inteiro em texto: `400`.
      schema:
        $ref: "#/components/schemas/StreamEventId"
    # --- só classroom-api: notificações (Fase 4) ---
    NotificationLimit:
      name: limit
      in: query
      description: Itens por página da central (padrão 20, máximo 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    UnsubscribeTokenPath:
      name: token
      in: path
      required: true
      description: |
        Token do link de descadastro: 64 caracteres hexadecimais, gravado em
        `notification_unsubscribe_tokens`. Outro formato ou token desconhecido responde `404`.
      schema:
        type: string
        minLength: 1
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    SlugPath:
      name: slug
      in: path
      required: true
      description: Identificador legível do produto na URL (único por tipo de produto).
      schema:
        $ref: "#/components/schemas/Slug"
  headers:
    # --- comum ---
    XRequestId:
      description: Identificador da requisição, o mesmo que aparece nos logs.
      schema:
        type: string
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Endereço para onde o navegador é redirecionado.
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: |
        Grava ou apaga um cookie do site: o da sessão ou o de retorno do login social
        (`specs/007-contas-e-autenticacao.md`, "Cookies"). Os dois são `HttpOnly`: o site não os
        lê; o navegador os guarda e reenvia sozinho.
      schema:
        type: string
    NoStore:
      description: Sempre `no-store`; a resposta não é guardada em cache.
      schema:
        type: string
        const: no-store
    ETag:
      description: Hash do conteúdo da variante; muda quando o conteúdo muda.
      schema:
        type: string
    ImageCacheControl:
      description: |
        Sempre `public, max-age=31536000, immutable`: a URL de uma imagem nunca muda de conteúdo.
      schema:
        type: string
        const: public, max-age=31536000, immutable
    ContentTypeOptions:
      description: Sempre `nosniff`.
      schema:
        type: string
        const: nosniff
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    ContentDisposition:
      description: Sempre `attachment`, com o nome sugerido do arquivo (`filename`).
      schema:
        type: string
  responses:
    # --- comum ---
    BadRequest:
      description: |
        Requisição fora do contrato (`validation_failed`); `errors` lista os campos. Vale também
        para operação sem parâmetros: cabeçalho ou URL malformados são recusados antes da rota.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Sem sessão válida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Sem permissão para a operação (`permission_denied`), escrita sem `X-CSRF-Token` válido
        (`csrf_token_invalid`) ou outra recusa de acesso com `code` próprio.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente ou fora do alcance de quem pede.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado, com `code` próprio (por exemplo, `version_conflict`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: |
        Corpo acima do limite da rota (`payload_too_large`): 1 MB, ou 5 MB no envio de imagem.
        A rota não roda.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: |
        `Content-Type` que a operação não declara em `requestBody.content`, ou que o serviço não
        sabe ler (`unsupported_media_type`). A rota não roda.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Regra de negócio impede a operação; o `code` é o da regra.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Limite de taxa atingido (`rate_limited`); `retryAfterSeconds` repete o `Retry-After`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Erro inesperado (`internal_error`), sem `detail`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência indisponível (banco ou provedor externo).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: |
        Limite de taxa (`rate_limited`) ou bloqueio por tentativas erradas de senha, da conta ou
        do IP (`too_many_attempts`; `specs/007-contas-e-autenticacao.md`, "Bloqueio e dispositivo
        novo"). `Retry-After` e `retryAfterSeconds` trazem os segundos até poder tentar de novo.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ImageVariant:
      description: A variante, em WebP.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/ImageCacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        image/webp:
          schema:
            type: string
            contentMediaType: image/webp
    ImageNotModified:
      description: O `If-None-Match` é igual ao `ETag` atual; sem corpo.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/ImageCacheControl"
    # --- só classroom-api ---
    Gone:
      description: Link vencido, já usado ou desconhecido (`token_expired`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthReturn:
      description: |
        Volta ao próprio site (`Location`), conforme a tabela da descrição da operação. Abre a
        sessão (`Set-Cookie` de `nuva_classroom_session`) quando entrou, e regrava ou apaga o
        cookie de retorno (`nuva_classroom_oauth`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Location:
          $ref: "#/components/headers/Location"
        Set-Cookie:
          $ref: "#/components/headers/SetCookie"
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    Pdf:
      description: |
        O arquivo PDF. `Content-Disposition` sugere o nome do arquivo; a resposta não é guardada em
        cache.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Disposition:
          $ref: "#/components/headers/ContentDisposition"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
      content:
        application/pdf:
          schema:
            type: string
            contentMediaType: application/pdf
    # --- só classroom-api: Fase 2 ---
    AccessDenied:
      description: |
        Sem acesso ao conteúdo (`access_denied`, com `reason`), sem permissão (`permission_denied`) ou
        escrita sem `X-CSRF-Token` válido (`csrf_token_invalid`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AccessDeniedProblem"
    NoteConflict:
      description: A nota mudou em outro dispositivo (`version_conflict`), com a versão atual.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/NoteConflictProblem"
  schemas:
    # --- comum ---
    Uuid:
      type: string
      format: uuid
      description: Identificador de recurso.
      examples: [0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70]
    DateTime:
      type: string
      format: date-time
      description: Instante em ISO 8601, sempre em UTC (sufixo `Z`).
      examples: ["2026-11-24T13:45:00Z"]
    Date:
      type: string
      format: date
      description: Data de calendário em ISO 8601, sem hora.
      examples: ["2026-11-24"]
    Cursor:
      type: string
      minLength: 1
      description: Cursor opaco de paginação; o cliente só o devolve como recebeu.
    MoneyCents:
      type: integer
      description: Valor em centavos inteiros, na moeda da instalação.
      examples: [19900]
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Moeda da instalação em ISO 4217 (`NUVA_CURRENCY`).
      examples: [BRL]
    Locale:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      description: Idioma em BCP 47 (`NUVA_LOCALE`).
      examples: [pt-BR]
    Page:
      type: object
      description: |
        Parte comum da resposta de listagem paginada por cursor. Traz só `nextCursor`: cada
        listagem a compõe com `allOf` e declara `items`, obrigatório, no próprio membro, com o
        esquema dos itens:

        ```yaml
        UserPage:
          allOf:
            - $ref: "#/components/schemas/Page"
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
        ```

        `items` não é declarado aqui porque a interseção de um `items` genérico com o da
        listagem tiparia o cliente gerado como `unknown[] & User[]`. Nem este esquema nem o
        membro da listagem usam `additionalProperties: false`, que invalidaria a composição.
      required: [nextCursor]
      properties:
        nextCursor:
          description: Cursor da próxima página; `null` na última.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
    ProblemFieldError:
      type: object
      description: Um campo recusado na validação.
      required: [path, message]
      properties:
        path:
          type: string
          description: Caminho do campo na requisição.
          examples: [body.email]
        message:
          type: string
    Problem:
      type: object
      description: |
        Erro no formato RFC 9457. Pode trazer campos extras conforme o `code`; os comuns estão
        declarados aqui (`errors`, `retryAfterSeconds`).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifica o tipo do problema; `about:blank` quando não há página própria.
          default: about:blank
        title:
          type: string
          description: Resumo curto, igual para todas as ocorrências do tipo.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: O mesmo código de status da resposta HTTP.
        detail:
          type: string
          description: Explicação desta ocorrência.
        instance:
          type: string
          format: uri-reference
          description: Caminho da requisição que falhou.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Identificador estável do erro, para o cliente decidir o que fazer. A lista é aberta:
            um `code` só muda ou some com mudança de versão da API, e código novo pode surgir.

            Códigos gerais, iguais nas duas APIs (`specs/003-admin-api.md`):

            | `code` | Status | Quando |
            | --- | --- | --- |
            | `validation_failed` | 400 | Requisição fora do contrato; `errors` lista os campos |
            | `unauthenticated` | 401 | Sem sessão válida |
            | `permission_denied` | 403 | Sessão válida, sem permissão para a operação |
            | `csrf_token_invalid` | 403 | Escrita sem `X-CSRF-Token` ou com token diferente do da sessão |
            | `not_found` | 404 | Recurso inexistente ou fora do alcance de quem pede |
            | `version_conflict` | 409 | `version` enviada diferente da gravada |
            | `payload_too_large` | 413 | Corpo acima do limite da rota |
            | `unsupported_media_type` | 415 | `Content-Type` que a operação não declara, ou que o serviço não sabe ler |
            | `rate_limited` | 429 | Limite de taxa; traz `retryAfterSeconds` |
            | `internal_error` | 500 | Erro inesperado; sem `detail` |
            | `database_unavailable` | 503 | Banco indisponível |
            | `payment_provider_unavailable` | 503 | Provedor de pagamento indisponível |

            Os demais `403`, `409`, `422` e `503` usam um código próprio da regra, definido na
            spec do recurso e citado na descrição da operação (por exemplo, `entitlement_required`).
          examples: [permission_denied, validation_failed, database_unavailable]
        errors:
          type: array
          description: Presente em erro de validação (`400`).
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: |
            Segundos até poder tentar de novo; o mesmo valor do cabeçalho `Retry-After`.
            Presente em `rate_limited` (`429`).
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    ReadinessCheck:
      type: string
      enum: [ok, fail]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, migrations]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Conexão com o PostgreSQL.
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Banco na versão de migration esperada pelo serviço.
          additionalProperties: false
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, facebook, apple]
      description: Provedor de login social.
    Meta:
      type: object
      description: |
        Dados públicos da instalação e da marca da escola (`specs/003-admin-api.md`, "Meta").
        Todos os campos estão sempre presentes; `logoUrl` e `accentColor` podem ser `null`.
      required:
        - schoolName
        - version
        - currency
        - locale
        - authProviders
        - logoUrl
        - accentColor
        - sourceCodeUrl
      properties:
        schoolName:
          type: string
          description: Nome da escola, definido na configuração do admin; padrão `nuva-edu`.
        version:
          type: string
          description: Versão instalada do nuva-edu (SemVer).
          examples: [0.1.0]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        locale:
          $ref: "#/components/schemas/Locale"
        authProviders:
          type: array
          description: |
            Provedores de login social configurados nesta instalação; vazio quando nenhum.
            Login por e-mail e senha está sempre disponível e não aparece na lista.
          items:
            $ref: "#/components/schemas/AuthProvider"
          uniqueItems: true
        logoUrl:
          type: [string, "null"]
          format: uri-reference
          description: |
            Caminho do logotipo na própria API, na variante de 256 px
            (`specs/029-imagens.md`). `null` sem logotipo: os sites mostram só o nome.
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/256.webp, null]
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: |
            Cor de destaque da escola, em `#RRGGBB`. `null` usa a cor de destaque padrão de
            `packages/ui`.
          examples: ["#1F6FEB", null]
        sourceCodeUrl:
          type: string
          format: uri
          description: |
            Endereço do código-fonte desta instalação, exigido pela AGPL-3.0. Sempre presente;
            padrão `https://github.com/patrickbrandao/nuva-edu`.
          examples: [https://github.com/patrickbrandao/nuva-edu]
      additionalProperties: false
    Email:
      type: string
      format: email
      maxLength: 254
      description: |
        Endereço de e-mail. A API o normaliza (minúsculas) antes de gravar ou comparar.
      examples: [ana@example.com]
    UserRole:
      type: string
      enum: [student, instructor, manager, admin]
      description: Papel do usuário (`specs/008-papeis-e-permissoes.md`).
    PermissionAction:
      type: string
      pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)*$"
      description: |
        Identificador de uma ação da matriz de permissões (`specs/008-papeis-e-permissoes.md`,
        "Identificadores das ações"), o mesmo de `x-permission`. A lista é aberta: ação nova
        entra pela spec 008.
      examples: [users.list, account.self_service]
    SessionSite:
      type: string
      enum: [classroom, admin]
      description: Site em que a sessão foi aberta.
    SessionUser:
      type: object
      description: Dono da sessão. Não tem campo de senha; `hasPassword` só diz se há uma definida.
      required: [id, name, email, emailVerified, role, avatarUrl, hasPassword]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          description: Nome de exibição.
        email:
          $ref: "#/components/schemas/Email"
        emailVerified:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: |
            Caminho da variante de 256 px do avatar na própria API; `null` sem avatar (o site
            mostra as iniciais do nome).
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/256.webp, null]
        hasPassword:
          type: boolean
          description: Verdadeiro quando a conta tem senha definida.
      additionalProperties: false
    SessionInfo:
      type: object
      description: Uma sessão aberta, nos dois sites.
      required: [id, site, ip, browser, os, createdAt, lastUsedAt, current]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: Identificador público da sessão (não é o valor do cookie).
        site:
          $ref: "#/components/schemas/SessionSite"
        ip:
          type: [string, "null"]
          description: IP de onde a sessão foi aberta.
          examples: [203.0.113.10]
        browser:
          type: [string, "null"]
          description: Família do navegador, lida do `User-Agent`; `null` quando não reconhecida.
          examples: [Chrome]
        os:
          type: [string, "null"]
          description: Sistema, lido do `User-Agent`; `null` quando não reconhecido.
          examples: [macOS]
        createdAt:
          $ref: "#/components/schemas/DateTime"
        lastUsedAt:
          $ref: "#/components/schemas/DateTime"
        current:
          type: boolean
          description: Verdadeiro na sessão que fez a requisição.
      additionalProperties: false
    SessionInfoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Mais recente primeiro (`lastUsedAt`).
          items:
            $ref: "#/components/schemas/SessionInfo"
      additionalProperties: false
    Identity:
      type: object
      description: Provedor de login social vinculado à conta.
      required: [provider, email, createdAt]
      properties:
        provider:
          $ref: "#/components/schemas/AuthProvider"
        email:
          type: [string, "null"]
          description: E-mail informado pelo provedor; `null` quando ele não enviou.
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    TermsDocument:
      type: string
      enum: [terms, privacy]
      description: Documento legal (`specs/030-lgpd.md`), Termos de Uso ou Política de Privacidade.
    ImageVariantWidth:
      type: integer
      enum: [64, 256, 480, 512, 1280, 1600]
      description: Largura de uma variante de imagem, em pixels (`specs/029-imagens.md`).
    # --- só classroom-api: contas, termos e imagens ---
    EmailToken:
      type: string
      minLength: 1
      maxLength: 128
      description: Token do link enviado por e-mail (32 bytes em base64url), como veio na URL.
    EmailTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/EmailToken"
      additionalProperties: false
    TermsVersion:
      type: object
      description: Uma versão publicada de um documento legal, sem o texto (`specs/030-lgpd.md`).
      required: [id, document, version, effectiveAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        document:
          $ref: "#/components/schemas/TermsDocument"
        version:
          type: integer
          minimum: 1
          description: Número sequencial da versão, por documento.
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    LegalDocument:
      type: object
      description: A versão vigente de um documento legal, com o texto.
      required: [id, document, version, bodyMd, effectiveAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        document:
          $ref: "#/components/schemas/TermsDocument"
        version:
          type: integer
          minimum: 1
        bodyMd:
          type: string
          description: Texto em Markdown.
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    Session:
      type: object
      description: |
        Sessão do classroom (`specs/007-contas-e-autenticacao.md`, "Esquemas comuns"). Com
        `termsPending` não vazio, as escritas respondem `403` `terms_acceptance_pending`, exceto
        `POST /api/v1/me/terms-acceptance`, `POST /api/v1/auth/logout` e as de
        `/api/v1/account/sessions`.
      required: [user, csrfToken, permissions, expiresAt, termsPending]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrfToken:
          type: string
          description: Valor do cabeçalho `X-CSRF-Token` nas escritas desta sessão.
        permissions:
          type: array
          description: Ações de `specs/008-papeis-e-permissoes.md` que o papel permite.
          items:
            $ref: "#/components/schemas/PermissionAction"
          uniqueItems: true
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        termsPending:
          type: array
          description: Versões vigentes que o usuário ainda precisa aceitar; vazia quando nenhuma.
          items:
            $ref: "#/components/schemas/TermsVersion"
      additionalProperties: false
    SocialPending:
      type: object
      description: |
        Cadastro social pendente, com o que o provedor informou e os termos vigentes
        (`specs/007-contas-e-autenticacao.md`, "Cadastro pendente").
      required: [provider, email, emailVerified, name, terms]
      properties:
        provider:
          $ref: "#/components/schemas/AuthProvider"
        email:
          type: [string, "null"]
          description: |
            E-mail informado pelo provedor; `null` quando ele não enviou: o site pede o e-mail e
            o manda em `POST /api/v1/auth/social/complete`.
        emailVerified:
          type: boolean
          description: Se o provedor atestou o e-mail como verificado.
        name:
          type: [string, "null"]
        terms:
          type: array
          description: Versões vigentes a aceitar; vazia quando não há versão publicada.
          items:
            $ref: "#/components/schemas/TermsVersion"
      additionalProperties: false
    IdentityList:
      type: object
      required: [hasPassword, items]
      properties:
        hasPassword:
          type: boolean
          description: Verdadeiro quando a conta tem senha definida.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
      additionalProperties: false
    AvatarResult:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: Variante de 256 px do avatar; `null` quando removido.
      additionalProperties: false
    ImagePurpose:
      type: string
      enum: [avatar]
      description: |
        Finalidade da imagem (`specs/029-imagens.md`). Na Fase 1 só existe `avatar`; as demais
        entram com os recursos que as usam.
    ImageVariantInfo:
      type: object
      required: [width, height, url]
      properties:
        width:
          $ref: "#/components/schemas/ImageVariantWidth"
        height:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri-reference
          description: Caminho de entrega (`/api/v1/images/{imageId}/{variant}.webp`).
          examples: [/api/v1/images/0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70/64.webp]
      additionalProperties: false
    Image:
      type: object
      description: Imagem enviada, com as variantes geradas.
      required: [id, purpose, width, height, variants]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        purpose:
          $ref: "#/components/schemas/ImagePurpose"
        width:
          type: integer
          minimum: 1
          description: Largura do arquivo enviado, em pixels.
        height:
          type: integer
          minimum: 1
          description: Altura do arquivo enviado, em pixels.
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImageVariantInfo"
      additionalProperties: false
    # --- só classroom-api: eventos do fluxo SSE ---
    StreamEventId:
      type: string
      pattern: "^[0-9]+$"
      description: |
        Campo `id` do SSE: inteiro em texto, tirado de uma sequência do banco. Crescente para
        cada usuário, não consecutivo.
      examples: ["42"]
    StreamDmMessageRef:
      type: object
      required: [conversationId, messageId]
      properties:
        conversationId:
          $ref: "#/components/schemas/Uuid"
        messageId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    StreamNotificationCreatedData:
      type: object
      required: [notificationId, type, unreadCount]
      properties:
        notificationId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          description: Tipo da notificação (`specs/024-notificacoes-e-email.md`).
        unreadCount:
          type: integer
          minimum: 0
          description: Notificações não lidas do usuário depois desta.
      additionalProperties: false
    StreamForumPostCreatedData:
      type: object
      required: [topicId, postId]
      properties:
        topicId:
          $ref: "#/components/schemas/Uuid"
        postId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    StreamAnnouncementPublishedData:
      type: object
      required: [announcementId, unreadCount]
      properties:
        announcementId:
          $ref: "#/components/schemas/Uuid"
        unreadCount:
          type: integer
          minimum: 0
          description: Novidades não lidas do usuário depois desta.
      additionalProperties: false
    StreamPresenceData:
      type: object
      required: [userId, online]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        online:
          type: boolean
      additionalProperties: false
    StreamPingData:
      type: object
      description: Sempre vazio.
      additionalProperties: false
    StreamEventDmMessageCreated:
      type: object
      description: Nova mensagem direta recebida.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.created
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventDmMessageRead:
      type: object
      description: O destinatário leu a mensagem.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.read
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventDmMessageDeleted:
      type: object
      description: Mensagem apagada.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.deleted
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventNotificationCreated:
      type: object
      description: Nova notificação.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: notification.created
        data:
          $ref: "#/components/schemas/StreamNotificationCreatedData"
      additionalProperties: false
    StreamEventForumPostCreated:
      type: object
      description: Nova resposta num tópico aberto na tela.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: forum.post.created
        data:
          $ref: "#/components/schemas/StreamForumPostCreatedData"
      additionalProperties: false
    StreamEventAnnouncementPublished:
      type: object
      description: Nova novidade publicada.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: announcement.published
        data:
          $ref: "#/components/schemas/StreamAnnouncementPublishedData"
      additionalProperties: false
    StreamEventPresence:
      type: object
      description: Mudança de presença de alguém numa conversa aberta.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: presence
        data:
          $ref: "#/components/schemas/StreamPresenceData"
      additionalProperties: false
    StreamEventPing:
      type: object
      description: Mantém a conexão viva; enviado a cada 25 s, sem `id`.
      required: [event, data]
      properties:
        event:
          type: string
          const: ping
        data:
          $ref: "#/components/schemas/StreamPingData"
      additionalProperties: false
    StreamEvent:
      description: Um evento do fluxo depois de lido (campos `id`, `event` e `data` do SSE).
      oneOf:
        - $ref: "#/components/schemas/StreamEventDmMessageCreated"
        - $ref: "#/components/schemas/StreamEventDmMessageRead"
        - $ref: "#/components/schemas/StreamEventDmMessageDeleted"
        - $ref: "#/components/schemas/StreamEventNotificationCreated"
        - $ref: "#/components/schemas/StreamEventForumPostCreated"
        - $ref: "#/components/schemas/StreamEventAnnouncementPublished"
        - $ref: "#/components/schemas/StreamEventPresence"
        - $ref: "#/components/schemas/StreamEventPing"
      discriminator:
        propertyName: event
        mapping:
          dm.message.created: "#/components/schemas/StreamEventDmMessageCreated"
          dm.message.read: "#/components/schemas/StreamEventDmMessageRead"
          dm.message.deleted: "#/components/schemas/StreamEventDmMessageDeleted"
          notification.created: "#/components/schemas/StreamEventNotificationCreated"
          forum.post.created: "#/components/schemas/StreamEventForumPostCreated"
          announcement.published: "#/components/schemas/StreamEventAnnouncementPublished"
          presence: "#/components/schemas/StreamEventPresence"
          ping: "#/components/schemas/StreamEventPing"
    # --- Fase 4: notificações e preferências (spec 024) ---
    NotificationGroup:
      type: string
      enum:
        [
          account,
          purchase,
          courses,
          forum,
          messages,
          community,
          events,
          support,
          announcements,
          moderation,
          staff,
        ]
      description: |
        Grupo de preferência (`specs/024-notificacoes-e-email.md`, "Tipos e grupos"); o grupo de
        cada tipo está na mesma tabela.
    NotificationData:
      type: object
      description: |
        Conteúdo do tipo, definido na spec do recurso (o `forum.reply` traz o tópico e a
        resposta; o `order.approved`, o pedido). Nunca contém senha, token nem segredo.
      additionalProperties: true
    NotificationActor:
      type: object
      description: Quem gerou o fato; ausente em aviso do sistema.
      required: [id, name, avatarUrl]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          description: Nome de exibição; `usuário removido` quando a conta foi excluída.
        avatarUrl:
          type: [string, "null"]
          description: Caminho da foto de perfil na API, ou nulo.
      additionalProperties: false
    NotificationItem:
      type: object
      description: |
        Um item da central (`specs/024-notificacoes-e-email.md`, "Central"): ícone do tipo, foto,
        título, texto curto, tempo e link para o alvo são montados a partir de `type`, `actor`,
        `data` e do alvo.
      required: [id, type, group, actor, targetType, targetId, data, count, readAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
          description: |
            Tipo da notificação (`specs/024-notificacoes-e-email.md`). Fica em texto, e não em
            `enum`, porque um worker mais novo pode gravar tipo que esta API ainda não conhece.
          examples: [forum.reply]
        group:
          $ref: "#/components/schemas/NotificationGroup"
        actor:
          oneOf:
            - $ref: "#/components/schemas/NotificationActor"
            - type: "null"
          description: Quem gerou o fato; nulo em aviso do sistema.
        targetType:
          type: [string, "null"]
          description: |
            Tipo do alvo (`topic`, `course`, `order`...), sempre junto de `targetId`; nulo quando
            a notificação não aponta para um recurso.
        targetId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        data:
          $ref: "#/components/schemas/NotificationData"
        count:
          type: integer
          minimum: 1
          description: Quantas notificações do mesmo tipo e alvo foram fundidas nesta linha.
        readAt:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: Quando foi lida; nulo enquanto não lida.
        createdAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationItem"
    NotificationUnreadCount:
      type: object
      description: Não lidas do usuário, para o sino.
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0
      additionalProperties: false
    NotificationReadResult:
      type: object
      description: Item marcado como lido e o contador do sino depois da leitura.
      required: [notification, unreadCount]
      properties:
        notification:
          $ref: "#/components/schemas/NotificationItem"
        unreadCount:
          type: integer
          minimum: 0
      additionalProperties: false
    NotificationsReadAllResult:
      type: object
      description: Resultado de "marcar todas como lidas".
      required: [updated, unreadCount]
      properties:
        updated:
          type: integer
          minimum: 0
          description: Quantas notificações passaram de não lidas a lidas nesta chamada.
        unreadCount:
          type: integer
          const: 0
      additionalProperties: false
    NotificationsCleared:
      type: object
      description: Resultado de "limpar todas".
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Quantas notificações foram apagadas.
      additionalProperties: false
    NotificationChannelPrefs:
      type: object
      description: Canais efetivos de um grupo.
      required: [inApp, email]
      properties:
        inApp:
          type: boolean
          description: Canal plataforma (central e sino).
        email:
          type: boolean
          description: Canal e-mail.
      additionalProperties: false
    NotificationGroupPrefs:
      type: object
      description: |
        Canais efetivos de um grupo e as regras que a interface precisa para desabilitar o que
        não pode mudar.
      required: [inApp, email, emailRequired, inAppAvailable]
      properties:
        inApp:
          type: boolean
        email:
          type: boolean
        emailRequired:
          type: boolean
          description: |
            `true` nos grupos obrigatórios (`account`, `purchase`, `support` e `moderation`): o
            e-mail não pode ser desligado (RF-04).
        inAppAvailable:
          type: boolean
          description: "`false` só no grupo `account`, que não tem canal plataforma."
      additionalProperties: false
    NotificationPrefs:
      type: object
      description: |
        Canais efetivos dos onze grupos (`specs/024-notificacoes-e-email.md`, "Tipos e grupos"),
        na ordem da tabela.
      required:
        [
          account,
          purchase,
          courses,
          forum,
          messages,
          community,
          events,
          support,
          announcements,
          moderation,
          staff,
        ]
      properties:
        account:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        purchase:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        courses:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        forum:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        messages:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        community:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        events:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        support:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        announcements:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        moderation:
          $ref: "#/components/schemas/NotificationGroupPrefs"
        staff:
          $ref: "#/components/schemas/NotificationGroupPrefs"
      additionalProperties: false
    NotificationChannelUpdate:
      type: object
      description: Canais a mudar num grupo; canal omitido fica como está.
      minProperties: 1
      properties:
        inApp:
          type: boolean
        email:
          type: boolean
      additionalProperties: false
    NotificationPrefsUpdate:
      type: object
      description: |
        Grupos a mudar; grupo omitido fica como está. Grupo obrigatório com `email: false` e
        grupo `account` com `inApp: true` são recusados com `400 validation_failed`.
      minProperties: 1
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        purchase:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        courses:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        forum:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        messages:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        community:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        events:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        support:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        announcements:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        moderation:
          $ref: "#/components/schemas/NotificationChannelUpdate"
        staff:
          $ref: "#/components/schemas/NotificationChannelUpdate"
    UnsubscribeResult:
      type: object
      description: Resultado do descadastro; só o e-mail do grupo do token muda.
      required: [group, prefs]
      properties:
        group:
          $ref: "#/components/schemas/NotificationGroup"
        prefs:
          $ref: "#/components/schemas/NotificationChannelPrefs"
      additionalProperties: false
    # --- comum: catálogo, aprendizado e certificados (Fase 2) ---
    ProductType:
      type: string
      enum: [course, bundle, ebook]
      description: Tipo de produto do catálogo (`specs/009-catalogo-e-conteudo.md`).
    AccessMode:
      type: string
      enum: [open, paid, private]
      description: |
        Modo de acesso do produto (`specs/009-catalogo-e-conteudo.md`, "Modos de acesso"): `open` para
        qualquer usuário logado, `paid` para quem tem direito ativo, `private` só por concessão, pacote
        ou
        plano, e nunca na vitrine.
    PublicationStatus:
      type: string
      enum: [draft, published]
      description: Estado de publicação de produto e de aula; só `published` aparece no classroom.
    CourseLevel:
      type: string
      enum: [beginner, intermediate, advanced]
      description: Nível do curso.
    VideoProvider:
      type: string
      enum: [youtube, vimeo, bunny, panda, file, link]
      description: |
        Provedor do vídeo, classificado pela API a partir da URL na gravação
        (`specs/009-catalogo-e-conteudo.md`,
        "Vídeo e links externos"). URL fora dos padrões da tabela, inclusive `.m3u8` de outro host, vira
        `link` (botão "Abrir vídeo", sem conclusão automática).
    LessonLinkKind:
      type: string
      enum: [file, page]
      description: "Tipo de link de apoio: arquivo ou página."
    LessonLink:
      type: object
      description: Link de apoio de uma aula, na ordem de `position`.
      required: [id, label, url, kind, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        url:
          type: string
          description: URL externa do material; só vai a quem tem acesso à aula.
        kind:
          $ref: "#/components/schemas/LessonLinkKind"
        position:
          type: integer
          minimum: 0
      additionalProperties: false
    ProductCover:
      type: object
      description: |
        Capa de um produto, imagem de finalidade `product_cover` em 16:9 (`specs/029-imagens.md`).
      required: [imageId, url, largeUrl]
      properties:
        imageId:
          $ref: "#/components/schemas/Uuid"
        url:
          type: string
          format: uri-reference
          description: Variante de 480 px (`/api/v1/images/{imageId}/480.webp`).
        largeUrl:
          type: string
          format: uri-reference
          description: Variante de 1280 px (`/api/v1/images/{imageId}/1280.webp`).
      additionalProperties: false
    CertificateState:
      type: string
      enum: [preparing, issued, revoked]
      description: |
        Estado de um certificado existente: `preparing` (registro criado, PDF ainda não gerado),
        `issued` (com PDF) ou `revoked` (`specs/015-certificados.md`).
    Slug:
      type: string
      minLength: 1
      maxLength: 160
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      description: "Identificador legível na URL: minúsculas, dígitos e hífens."
      examples: [introducao-ao-python]
    # --- só classroom-api: catálogo, aprendizado e certificados (Fase 2) ---
    CatalogItem:
      type: object
      description: Um produto na vitrine, sem nenhuma URL de conteúdo.
      required:
        [
          type,
          id,
          slug,
          title,
          summary,
          cover,
          level,
          accessMode,
          priceCents,
          accessDays,
          moduleCount,
          lessonCount,
          durationSeconds,
          itemCount,
          pages,
          publishedAt,
          updatedAt,
        ]
      properties:
        type:
          $ref: "#/components/schemas/ProductType"
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        summary:
          type: [string, "null"]
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        level:
          oneOf:
            - $ref: "#/components/schemas/CourseLevel"
            - type: "null"
          description: Só em curso.
        accessMode:
          type: string
          enum: [open, paid]
          description: Modo de acesso; produto `private` nunca aparece na vitrine.
        priceCents:
          type: [integer, "null"]
          minimum: 0
          description: Preço em centavos no modo `paid`; `null` em `open`.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso a partir da compra; `null` é vitalício.
        moduleCount:
          type: [integer, "null"]
          minimum: 0
          description: Só em curso.
        lessonCount:
          type: [integer, "null"]
          minimum: 0
          description: Só em curso.
        durationSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Só em curso.
        itemCount:
          type: [integer, "null"]
          minimum: 0
          description: Só em pacote.
        pages:
          type: [integer, "null"]
          minimum: 1
          description: Só em ebook.
        publishedAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    CatalogItemPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CatalogItem"
    ProgramLesson:
      type: object
      description: "Uma aula publicada no programa: título e duração, sem URL."
      required: [id, title, durationSeconds, isSample, position]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        durationSeconds:
          type: [integer, "null"]
          minimum: 0
        isSample:
          type: boolean
        position:
          type: integer
          minimum: 0
      additionalProperties: false
    ProgramModule:
      type: object
      required: [id, title, position, lessonCount, durationSeconds, lessons]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        position:
          type: integer
          minimum: 0
        lessonCount:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/ProgramLesson"
      additionalProperties: false
    CatalogCourse:
      type: object
      description: Página de curso na vitrine, com o programa.
      required:
        [
          type,
          id,
          slug,
          title,
          summary,
          description,
          cover,
          level,
          accessMode,
          priceCents,
          accessDays,
          moduleCount,
          lessonCount,
          durationSeconds,
          instructorName,
          program,
          publishedAt,
          updatedAt,
        ]
      properties:
        type:
          type: string
          const: course
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        summary:
          type: [string, "null"]
        description:
          type: [string, "null"]
          description: Markdown.
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        level:
          oneOf:
            - $ref: "#/components/schemas/CourseLevel"
            - type: "null"
        accessMode:
          type: string
          enum: [open, paid]
          description: Modo de acesso; produto `private` nunca aparece na vitrine.
        priceCents:
          type: [integer, "null"]
          minimum: 0
          description: Preço em centavos no modo `paid`; `null` em `open`.
        accessDays:
          type: [integer, "null"]
          minimum: 1
          description: Dias de acesso a partir da compra; `null` é vitalício.
        moduleCount:
          type: integer
          minimum: 0
        lessonCount:
          type: integer
          minimum: 0
          description: Aulas publicadas.
        durationSeconds:
          type: integer
          minimum: 0
          description: Soma das aulas publicadas.
        instructorName:
          type: [string, "null"]
          description: Nome de exibição do dono.
        program:
          type: array
          items:
            $ref: "#/components/schemas/ProgramModule"
        publishedAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: false
    CatalogBundleItem:
      type: object
      description: Um item de pacote.
      required: [type, id, slug, title, summary, cover, accessMode, priceCents, visible]
      properties:
        type:
          type: string
          enum: [course, ebook]
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        summary:
          type: [string, "null"]
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProductCover"
            - type: "null"
        accessMode:
          $ref: "#/components/schemas/AccessMode"
