      operationId: cancelMyOrder
      tags: [sales]
      summary: Cancelar pedido pendente
      x-permission: purchase.create
      x-nuva-pending: true
      description: |
        Cancela um pedido `pending` do próprio usuário antes do pagamento (`specs/011-vendas-e-checkout.md`,
        "Pedido e seus estados") e pede o cancelamento do checkout ao provedor. Pedido pago,
        reembolsado, expirado ou já cancelado: `409` `order_not_cancelable`. Pedido de outra pessoa
        ou `draft`: `404` `not_found`. Devolve o pedido já com `status: canceled`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Pedido cancelado.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
