openapi: 3.1.0
info:
  title: nuva-edu classroom-api
  version: 0.1.0
  summary: API do site do aluno, com o fluxo SSE.
  description: |
    Contrato da `classroom-api`, escrito à mão e anterior ao código (ADR 0009). O Fastify valida
    requisições e respostas contra este arquivo, e o cliente de `packages/api-client` é gerado dele.
    Comportamento: `specs/004-classroom-api.md`.

    **Caminhos e prefixo.** O servidor é a origem do site (`/`) e cada caminho aparece completo,
    igual à rota registrada no serviço. As rotas de negócio ficam sob `/api/v1`; `/healthz` e
    `/readyz` ficam na raiz, fora do prefixo, porque são sondas do processo e não fazem parte da
    versão da API. `/metrics` (texto Prometheus, só rede interna) não é descrita aqui.

    **Convenções.** JSON em UTF-8, campos em `camelCase`, datas ISO 8601 em UTC, dinheiro em
    centavos inteiros. Erros em `application/problem+json` (RFC 9457) com `code` estável.
    Listagens paginadas por cursor (`limit`, `cursor`) com resposta `{ items, nextCursor }`.
    Toda resposta traz `X-Request-Id`.

    **Sessão.** Cookie `nuva_classroom_session` (HttpOnly, Secure, SameSite=Lax). Requisições que alteram
    dados enviam `X-CSRF-Token`, obtido em `GET /api/v1/session`.

    **Componentes comuns.** Os esquemas, parâmetros, cabeçalhos e respostas marcados como
    "comum" em `components` são idênticos nos contratos da `admin-api` e da `classroom-api`;
    mudança em um é feita nos dois.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Mesma origem do site (uso normal; o site só chama a API do próprio endereço).
  - url: "{scheme}://{host}"
    description: Endereço explícito de uma instalação.
    variables:
      scheme:
        enum: [http, https]
        default: https
      host:
        default: classroom.localhost:8080
        description: Valor de `NUVA_CLASSROOM_HOST`, com a porta quando não for 80/443.
tags:
  - name: health
    description: Sondas do processo, fora de `/api/v1`.
  - name: meta
    description: Dados públicos da instalação.
  - name: stream
    description: Tempo real por SSE.
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Processo vivo
      description: |
        Responde sem tocar no banco. Usada pelo `healthcheck` do Docker.
      security: []
      responses:
        "200":
          description: O processo responde.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Pronto para atender
      description: |
        Confere a conexão com o banco e se as migrations estão na versão esperada. Não é roteada
        pelo proxy: serve ao `depends_on` do Compose e ao diagnóstico.
      security: []
      responses:
        "200":
          description: Pronto.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Não pronto; `checks` indica o que falhou.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Dados públicos da instalação
      description: |
        Nome da escola, versão, moeda, idioma e provedores de login social ativos. Não exige sessão.
      security: []
      responses:
        "200":
          description: Dados da instalação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/stream:
    get:
      operationId: openStream
      tags: [stream]
      summary: Fluxo de eventos do usuário (SSE)
      description: |
        Conexão `text/event-stream` que entrega mensagens diretas e notificações sem recarregar a
        página. O envio continua por HTTP comum.

        Cada evento tem três campos SSE: `id` (inteiro crescente por usuário), `event` (o nome) e
        `data` (um objeto JSON numa linha). No fio:

        ```
        id: 42
        event: dm.message.created
        data: {"conversationId":"0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70","messageId":"0193a5b2-8e2f-7a11-b0c3-5d7e9f1a2b3c"}

        ```

        Nomes de evento e o esquema do `data` de cada um estão em `StreamEvent` (`oneOf` com
        discriminador em `event`). O evento carrega só identificadores; o conteúdo é buscado pela
        rota normal, que checa permissão.

        - `ping` é enviado a cada 25 s, com `data: {}` e sem `id` (não altera o `Last-Event-ID`).
        - Na reconexão, `Last-Event-ID` faz a API reenviar o que foi perdido nos últimos 5 minutos;
          além disso, a interface recarrega as listas.
        - Limite de 3 conexões por usuário; a quarta derruba a mais antiga.
        - Sessão encerrada, suspensão `full` ou banco indisponível: o servidor fecha a conexão.
        - Resposta sem compressão.
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Fluxo aberto; a resposta só termina quando a conexão cai.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Sempre `no-store`.
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
                description: Sequência de eventos SSE; cada um, depois de lido, corresponde a um `StreamEvent`.
              x-event-schema:
                $ref: "#/components/schemas/StreamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuva_classroom_session
      description: |
        Identificador opaco da sessão (`specs/007-contas-e-autenticacao.md`). Vale só neste site.
  parameters:
    # --- comum ---
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` da página anterior. Ausente na primeira página.
      schema:
        $ref: "#/components/schemas/Cursor"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token da sessão, devolvido em `GET /api/v1/session`. Exigido em toda requisição que altera dados.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Chave escolhida pelo cliente; a repetição devolve a primeira resposta por 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    # --- só classroom-api ---
    LastEventId:
      name: Last-Event-ID
      in: header
      description: |
        `id` do último evento recebido; o navegador o envia sozinho ao reconectar.
      schema:
        $ref: "#/components/schemas/StreamEventId"
  headers:
    # --- comum ---
    XRequestId:
      description: Identificador da requisição, o mesmo que aparece nos logs.
      schema:
        type: string
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
        minimum: 0
  responses:
    # --- comum ---
    BadRequest:
      description: Requisição inválida; `errors` lista os campos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Sem sessão válida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Sem permissão para a operação.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente ou fora do alcance de quem pede.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado (por exemplo, `version` divergente).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Regra de negócio impede a operação.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Limite de taxa atingido.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Erro inesperado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência indisponível (banco ou provedor externo).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    # --- comum ---
    Uuid:
      type: string
      format: uuid
      description: Identificador de recurso.
      examples: [0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70]
    DateTime:
      type: string
      format: date-time
      description: Instante em ISO 8601, sempre em UTC (sufixo `Z`).
      examples: ["2026-11-24T13:45:00Z"]
    Date:
      type: string
      format: date
      description: Data de calendário em ISO 8601, sem hora.
      examples: ["2026-11-24"]
    Cursor:
      type: string
      minLength: 1
      description: Cursor opaco de paginação; o cliente só o devolve como recebeu.
    MoneyCents:
      type: integer
      description: Valor em centavos inteiros, na moeda da instalação.
      examples: [19900]
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Moeda da instalação em ISO 4217 (`NUVA_CURRENCY`).
      examples: [BRL]
    Locale:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
      description: Idioma em BCP 47 (`NUVA_LOCALE`).
      examples: [pt-BR]
    Page:
      type: object
      description: |
        Envelope de listagem paginada por cursor. Cada listagem o compõe com `allOf`,
        definindo o esquema dos itens.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          description: Cursor da próxima página; `null` na última.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
    ProblemFieldError:
      type: object
      description: Um campo recusado na validação.
      required: [path, message]
      properties:
        path:
          type: string
          description: Caminho do campo na requisição.
          examples: [body.email]
        message:
          type: string
    Problem:
      type: object
      description: Erro no formato RFC 9457. Pode trazer campos extras conforme o `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifica o tipo do problema; `about:blank` quando não há página própria.
          default: about:blank
        title:
          type: string
          description: Resumo curto, igual para todas as ocorrências do tipo.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: O mesmo código de status da resposta HTTP.
        detail:
          type: string
          description: Explicação desta ocorrência.
        instance:
          type: string
          format: uri-reference
          description: Caminho da requisição que falhou.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Identificador estável do erro, para o cliente decidir o que fazer.
          examples: [permission_denied, validation_failed, database_unavailable]
        errors:
          type: array
          description: Presente em erro de validação (`400`).
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    ReadinessCheck:
      type: string
      enum: [ok, fail]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, migrations]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Conexão com o PostgreSQL.
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
              description: Banco na versão de migration esperada pelo serviço.
          additionalProperties: false
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, facebook, apple]
      description: Provedor de login social.
    Meta:
      type: object
      required: [schoolName, version, currency, locale, authProviders]
      properties:
        schoolName:
          type: string
          description: Nome da escola, definido na configuração do admin.
        version:
          type: string
          description: Versão instalada do nuva-edu (SemVer).
          examples: [0.1.0]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        locale:
          $ref: "#/components/schemas/Locale"
        authProviders:
          type: array
          description: |
            Provedores de login social configurados nesta instalação; vazio quando nenhum.
            Login por e-mail e senha está sempre disponível e não aparece na lista.
          items:
            $ref: "#/components/schemas/AuthProvider"
          uniqueItems: true
      additionalProperties: false
    # --- só classroom-api: eventos do fluxo SSE ---
    StreamEventId:
      type: string
      pattern: "^[0-9]+$"
      description: Campo `id` do SSE. Inteiro crescente por usuário, em texto.
      examples: ["42"]
    StreamDmMessageRef:
      type: object
      required: [conversationId, messageId]
      properties:
        conversationId:
          $ref: "#/components/schemas/Uuid"
        messageId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    StreamNotificationCreatedData:
      type: object
      required: [notificationId, type, unreadCount]
      properties:
        notificationId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          description: Tipo da notificação (`specs/024-notificacoes-e-email.md`).
        unreadCount:
          type: integer
          minimum: 0
          description: Notificações não lidas do usuário depois desta.
      additionalProperties: false
    StreamForumPostCreatedData:
      type: object
      required: [topicId, postId]
      properties:
        topicId:
          $ref: "#/components/schemas/Uuid"
        postId:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: false
    StreamAnnouncementPublishedData:
      type: object
      required: [announcementId, unreadCount]
      properties:
        announcementId:
          $ref: "#/components/schemas/Uuid"
        unreadCount:
          type: integer
          minimum: 0
          description: Novidades não lidas do usuário depois desta.
      additionalProperties: false
    StreamPresenceData:
      type: object
      required: [userId, online]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        online:
          type: boolean
      additionalProperties: false
    StreamPingData:
      type: object
      description: Sempre vazio.
      additionalProperties: false
    StreamEventDmMessageCreated:
      type: object
      description: Nova mensagem direta recebida.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.created
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventDmMessageRead:
      type: object
      description: O destinatário leu a mensagem.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.read
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventDmMessageDeleted:
      type: object
      description: Mensagem apagada.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: dm.message.deleted
        data:
          $ref: "#/components/schemas/StreamDmMessageRef"
      additionalProperties: false
    StreamEventNotificationCreated:
      type: object
      description: Nova notificação.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: notification.created
        data:
          $ref: "#/components/schemas/StreamNotificationCreatedData"
      additionalProperties: false
    StreamEventForumPostCreated:
      type: object
      description: Nova resposta num tópico aberto na tela.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: forum.post.created
        data:
          $ref: "#/components/schemas/StreamForumPostCreatedData"
      additionalProperties: false
    StreamEventAnnouncementPublished:
      type: object
      description: Nova novidade publicada.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: announcement.published
        data:
          $ref: "#/components/schemas/StreamAnnouncementPublishedData"
      additionalProperties: false
    StreamEventPresence:
      type: object
      description: Mudança de presença de alguém numa conversa aberta.
      required: [id, event, data]
      properties:
        id:
          $ref: "#/components/schemas/StreamEventId"
        event:
          type: string
          const: presence
        data:
          $ref: "#/components/schemas/StreamPresenceData"
      additionalProperties: false
    StreamEventPing:
      type: object
      description: Mantém a conexão viva; enviado a cada 25 s, sem `id`.
      required: [event, data]
      properties:
        event:
          type: string
          const: ping
        data:
          $ref: "#/components/schemas/StreamPingData"
      additionalProperties: false
    StreamEvent:
      description: Um evento do fluxo depois de lido (campos `id`, `event` e `data` do SSE).
      oneOf:
        - $ref: "#/components/schemas/StreamEventDmMessageCreated"
        - $ref: "#/components/schemas/StreamEventDmMessageRead"
        - $ref: "#/components/schemas/StreamEventDmMessageDeleted"
        - $ref: "#/components/schemas/StreamEventNotificationCreated"
        - $ref: "#/components/schemas/StreamEventForumPostCreated"
        - $ref: "#/components/schemas/StreamEventAnnouncementPublished"
        - $ref: "#/components/schemas/StreamEventPresence"
        - $ref: "#/components/schemas/StreamEventPing"
      discriminator:
        propertyName: event
        mapping:
          dm.message.created: "#/components/schemas/StreamEventDmMessageCreated"
          dm.message.read: "#/components/schemas/StreamEventDmMessageRead"
          dm.message.deleted: "#/components/schemas/StreamEventDmMessageDeleted"
          notification.created: "#/components/schemas/StreamEventNotificationCreated"
          forum.post.created: "#/components/schemas/StreamEventForumPostCreated"
          announcement.published: "#/components/schemas/StreamEventAnnouncementPublished"
          presence: "#/components/schemas/StreamEventPresence"
          ping: "#/components/schemas/StreamEventPing"
