openapi: 3.1.0
info:
  title: nuva-edu classroom-api
  version: 0.1.0
  summary: API do site do aluno, com o fluxo SSE.
  description: |
    Contrato da `classroom-api`, escrito à mão e anterior ao código (ADR 0009). O Fastify valida
    requisições e respostas contra este arquivo, e o cliente de `packages/api-client` é gerado dele.
    Comportamento: `specs/004-classroom-api.md`.

    **Caminhos e prefixo.** O servidor é a origem do site (`/`) e cada caminho aparece completo,
    igual à rota registrada no serviço. As rotas de negócio ficam sob `/api/v1`; `/healthz` e
    `/readyz` ficam na raiz, fora do prefixo, porque são sondas do processo e não fazem parte da
    versão da API. `/metrics` (texto Prometheus, só rede interna) não é descrita aqui.

    **Convenções.** JSON em UTF-8, campos em `camelCase`, datas ISO 8601 em UTC, dinheiro em
    centavos inteiros. Erros em `application/problem+json` (RFC 9457) com `code` estável; os
    códigos gerais estão no esquema `Problem` e em `specs/003-admin-api.md`.
    Listagens paginadas por cursor (`limit`, `cursor`) com resposta `{ items, nextCursor }`:
    cada listagem compõe `Page` por `allOf` e declara o próprio `items` (ver o esquema `Page`).
    Toda resposta traz `X-Request-Id`.

    **Sessão.** Cookie `nuva_classroom_session` (HttpOnly, Secure, SameSite=Lax).

    **CSRF.** Toda operação que altera dados exige, além do cookie, o cabeçalho `X-CSRF-Token`
    com o token devolvido em `GET /api/v1/session`; sem ele, ou com valor diferente, a resposta
    é `403` com `code: csrf_token_invalid`. No contrato a exigência é o esquema de segurança
    `csrfToken`, declarado junto de `sessionCookie` no `security` de cada operação de escrita, e
    não um parâmetro de cabeçalho: é uma credencial da sessão, igual em todas as escritas, que o
    cliente de `packages/api-client` preenche sozinho. Como parâmetro obrigatório, o tipo gerado
    cobraria o cabeçalho em cada chamada; como parâmetro opcional, o contrato diria que a API
    aceita escrita sem ele. Operação de escrita sem `csrfToken` no `security` é exceção e diz o
    motivo na própria descrição.

    **Componentes comuns.** Os esquemas, parâmetros, cabeçalhos, respostas e o esquema de
    segurança `csrfToken`, marcados como
    "comum" em `components` são idênticos nos contratos da `admin-api` e da `classroom-api`;
    mudança em um é feita nos dois.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Mesma origem do site (uso normal; o site só chama a API do próprio endereço).
  - url: "{scheme}://{host}"
    description: Endereço explícito de uma instalação.
    variables:
      scheme:
        enum: [http, https]
        default: https
      host:
        default: classroom.localhost:8080
        description: Valor de `NUVA_CLASSROOM_HOST`, com a porta quando não for 80/443.
tags:
  - name: health
    description: Sondas do processo, fora de `/api/v1`.
  - name: meta
    description: Dados públicos da instalação e da marca da escola.
  - name: stream
    description: Tempo real por SSE.
  - name: notifications
    description: Central de notificações, preferências e descadastro (`specs/024-notificacoes-e-email.md`).
  - name: auth
    description: Cadastro, login, sessão, senha e login social (`specs/007-contas-e-autenticacao.md`).
  - name: account
    description: Métodos de acesso, sessões e avatar do próprio usuário.
  - name: legal
    description: Termos de Uso, Política de Privacidade e aceite (`specs/030-lgpd.md`).
  - name: images
    description: Envio e entrega de imagens (`specs/029-imagens.md`).
  - name: catalog
    description: Vitrine, produtos e programa (`specs/009-catalogo-e-conteudo.md`).
  - name: learning
    description: Aula, progresso, estante e direitos do aluno (`specs/014-aprendizado-e-progresso.md`).
  - name: notes
    description: Anotações privadas (`specs/016-anotacoes.md`).
  - name: certificates
    description: Certificados e validação pública (`specs/015-certificados.md`).
  - name: sales
    description: Cesta, cupom, dados de comprador e pedidos do aluno (`specs/011-vendas-e-checkout.md`).
  - name: webhooks
    description: Aviso de pagamento do provedor, autenticado por assinatura (`specs/013-pagamentos-mercado-pago.md`).

security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Processo vivo
      description: |
        Responde sem tocar no banco. Usada pelo `healthcheck` do Docker.
      security: []
      responses:
        "200":
          description: O processo responde.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Pronto para atender
      description: |
        Confere a conexão com o banco e se as migrations estão na versão esperada. Não é roteada
        pelo proxy: serve ao `depends_on` do Compose e ao diagnóstico.
      security: []
      responses:
        "200":
          description: Pronto.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Não pronto; `checks` indica o que falhou.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Dados públicos da instalação
      description: |
        Dados públicos da instalação e da marca da escola: nome, versão, moeda, idioma, provedores
        de login social ativos, logotipo, cor de destaque e endereço do código-fonte. Não exige
        sessão. É o único endpoint de marca: os dois sites o chamam ao carregar, e as duas APIs
        devolvem o mesmo esquema `Meta`. Nome, logotipo, cor e endereço do código-fonte vêm da
        configuração da escola (`settings`), com o padrão quando não há nada gravado.
      security: []
      responses:
        "200":
          description: Dados da instalação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/stream:
    get:
      operationId: openStream
      tags: [stream]
      summary: Fluxo de eventos do usuário (SSE)
      description: |
        Conexão `text/event-stream` que entrega mensagens diretas e notificações sem recarregar a
        página. O envio continua por HTTP comum.

        Cada evento tem três campos SSE: `id`, `event` (o nome) e `data` (um objeto JSON numa
        linha). No fio:

        ```
        id: 42
        event: dm.message.created
        data: {"conversationId":"0193a5b2-7c1e-7d3a-9f4b-2a6c8e1d5f70","messageId":"0193a5b2-8e2f-7a11-b0c3-5d7e9f1a2b3c"}

        ```

        Nomes de evento e o esquema do `data` de cada um estão em `StreamEvent` (`oneOf` com
        discriminador em `event`). O evento carrega só identificadores; o conteúdo é buscado pela
        rota normal, que checa permissão.

        - O `id` vem de uma sequência do banco, uma só para todos os usuários e para todos os
          processos que publicam (ADR 0020): para cada usuário ele é crescente, mas não
          consecutivo. O cliente só o compara e o devolve em `Last-Event-ID`; lacuna entre dois
          `id` não indica evento perdido.
        - `ping` é enviado a cada 25 s, com `data: {}` e sem `id` (não altera o `Last-Event-ID`).
        - Ao abrir, a API envia o comentário `: ok`, para os cabeçalhos saírem de imediato.
        - Reenvio na reconexão: a API guarda em memória, por processo, os eventos de cada usuário
          dos últimos 5 minutos, até 500 por usuário (os mais antigos saem primeiro). Com
          `Last-Event-ID`, reenvia os guardados de `id` maior, em ordem, antes dos novos.
        - O reenvio cobre a queda de rede do navegador; não cobre o reinício da API nem a troca
          de processo. Por isso o fluxo é só um atalho: o estado está no banco, e a interface
          recarrega as listas afetadas a cada reconexão, com ou sem reenvio.
        - Limite de 3 conexões por usuário; a quarta derruba a mais antiga.
        - Sessão encerrada, suspensão `full` ou banco indisponível: o servidor fecha a conexão.
        - Resposta sem compressão.
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Fluxo aberto; a resposta só termina quando a conexão cai.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Sempre `no-store`.
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
                description: Sequência de eventos SSE; cada um, depois de lido, corresponde a um `StreamEvent`.
              x-event-schema:
                $ref: "#/components/schemas/StreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Cadastro por e-mail e senha
      description: |
        Cria a conta `student` (`specs/007-contas-e-autenticacao.md`, "Cadastro por e-mail e
        senha"). **Não abre sessão**: responde `204` também quando o e-mail já tem conta (o dono
        recebe o e-mail `account.exists` e nada muda na conta), para a resposta não revelar se o
        e-mail existe. Em seguida o site chama `POST /api/v1/auth/login` com o mesmo e-mail e a
        mesma senha.

        Validação, nesta ordem: formato dos campos (`400`; senha fora de 8 a 128 caracteres é
        `400` com `code: password_invalid`, conferida pela regra e não pelo esquema), aceite dos
        termos vigentes quando houver versão publicada (`422` `terms_acceptance_required`, com
        `errors[]` indicando o documento). Sem versão publicada, `acceptedTerms` vai vazio.

        **Exceção de CSRF.** Não declara `csrfToken`: não há sessão, e portanto não há token. A
        proteção é o corpo só em `application/json` (outro tipo: `415`; um formulário de outro
        site não envia JSON sem CORS, que a API não habilita).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, acceptedTerms]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Nome de exibição.
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  description: 8 a 128 caracteres, sem outra regra; fora disso, `password_invalid`.
                acceptedTerms:
                  type: array
                  description: |
                    `id` das versões vigentes (`terms` e `privacy`) que o usuário aceitou, como
                    vêm em `GET /api/v1/legal/{document}`.
                  items:
                    $ref: "#/components/schemas/Uuid"
                  uniqueItems: true
                  maxItems: 2
              additionalProperties: false
      responses:
        "204":
          description: Pedido aceito (conta nova ou e-mail já cadastrado; a resposta é a mesma).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login por e-mail e senha
      description: |
        Abre a sessão do classroom (`specs/007-contas-e-autenticacao.md`, "Login por senha") e
        grava o cookie `nuva_classroom_session`.

        - Qualquer falha de credencial (senha errada, vazia, só de espaços, conta sem senha,
          e-mail inexistente ou conta excluída): `401` `invalid_credentials`, no mesmo tempo.
        - Conta com suspensão `full`, só depois de a senha conferir: `403` `account_suspended`.
        - Conta ou IP bloqueado por tentativas erradas: `429` `too_many_attempts`, com
          `Retry-After`.

        **Exceção de CSRF.** Não declara `csrfToken`: ainda não há sessão. A proteção é o corpo só
        em `application/json` (outro tipo: `415`) e o cookie de sessão `SameSite=Lax`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  description: Sem regra de tamanho aqui; qualquer valor errado é `invalid_credentials`.
              additionalProperties: false
      responses:
        "200":
          description: Sessão aberta.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sair
      description: |
        Encerra a sessão atual e apaga o cookie. Aceita mesmo com termos pendentes.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Sessão encerrada; o cookie é apagado.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Sessão atual
      description: |
        Dono da sessão, token CSRF, ações permitidas e termos pendentes. Sem sessão válida:
        `401` `unauthenticated`, e o cookie é apagado.
      responses:
        "200":
          description: A sessão atual.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirmar o e-mail
      description: |
        Confirma o e-mail com o token do link `<classroomUrl>/confirmar?token=<token>`
        (`specs/007-contas-e-autenticacao.md`, "Confirmação de e-mail"). Token vencido, já usado
        ou desconhecido: `410` `token_expired`.

        **Exceção de CSRF.** Não declara `csrfToken`: quem abre o link pode não ter sessão. A
        proteção é o corpo só em `application/json` (outro tipo: `415`) e o token de uso único.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTokenRequest"
      responses:
        "204":
          description: E-mail confirmado.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/email/resend:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Reenviar o link de confirmação
      description: |
        Enfileira um novo link de confirmação; o anterior deixa de valer. Até 3 por hora por
        usuário (`429` `rate_limited`). E-mail já confirmado: `204` sem envio.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Pedido aceito.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Esqueci a senha
      description: |
        Responde sempre `204`. Se a conta existir (e não estiver excluída), enfileira o e-mail
        `account.password_reset` com link de 24 h para `<classroomUrl>/redefinir?token=<token>`.
        Conta só com provedor também recebe o link: usá-lo define a primeira senha.

        **Exceção de CSRF.** Não declara `csrfToken`: quem esqueceu a senha não tem sessão. A
        proteção é o corpo só em `application/json` (outro tipo: `415`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
              additionalProperties: false
      responses:
        "204":
          description: Pedido aceito (a resposta não diz se a conta existe).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Redefinir a senha
      description: |
        Define a senha com o token do link, confirma o e-mail, marca o token como usado e
        invalida os outros tokens de redefinição da conta; encerra todas as sessões do usuário.
        Não abre sessão: o site leva a `/entrar`.

        - Senha fora de 8 a 128 caracteres: `400` `password_invalid`.
        - Token vencido, já usado ou desconhecido: `410` `token_expired`.

        **Exceção de CSRF.** Não declara `csrfToken`: quem redefine a senha não tem sessão. A
        proteção é o corpo só em `application/json` (outro tipo: `415`) e o token de uso único.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  $ref: "#/components/schemas/EmailToken"
                password:
                  type: string
                  description: Nova senha, 8 a 128 caracteres; fora disso, `password_invalid`.
              additionalProperties: false
      responses:
        "204":
          description: Senha definida.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Início do login social
      description: |
        O site **navega** para esta URL (navegação de página, não `fetch`;
        `specs/007-contas-e-autenticacao.md`, "Fluxo do provedor"). A API gera `state`, `nonce` e
        o verificador PKCE, grava o cookie de retorno `nuva_classroom_oauth` (10 minutos) e
        redireciona para a autorização do provedor.

        - `intent=login` (padrão): entra ou cadastra. `intent=link`: vincula o provedor à conta
          da sessão; sem sessão válida, `401` `unauthenticated`. Por isso a operação é pública
          no contrato: a sessão só é lida quando `intent=link`.
        - Provedor desligado nesta instalação: `404`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthProviderPath"
        - name: intent
          in: query
          description: "`login` entra ou cadastra; `link` vincula à conta da sessão."
          schema:
            type: string
            enum: [login, link]
            default: login
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "302":
          description: Redireciona para a autorização do provedor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
