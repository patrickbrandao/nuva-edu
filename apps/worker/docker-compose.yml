# worker: consome a fila de tarefas do PostgreSQL e agenda as recorrentes (specs 005 e 031).
# Só fala com a rede interna: a porta 3000 serve saúde e métricas e não passa pelo proxy.

services:
  worker:
    image: tmsoftbrasil/nuva-edu-worker:${NUVA_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        NUVA_VERSION: ${NUVA_VERSION:-}
    restart: unless-stopped
    # No SIGTERM o worker espera até 30 s pelas tarefas em execução; o Docker precisa esperar mais.
    stop_grace_period: 40s
    # Variáveis não secretas e ajustes da instalação. O que está em `environment` vale por cima.
    env_file:
      - path: ../../.env
        required: false
      - path: ../../.env.local
        required: false
    environment:
      # Dentro da rede do Compose o banco é sempre postgres:5432; NUVA_POSTGRES_PORT do .env é
      # só a porta publicada no hospedeiro.
      POSTGRES_HOST: postgres
      NUVA_POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nuva_edu}
      POSTGRES_USER: ${POSTGRES_USER:-nuva_edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.local}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          cpus: "${NUVA_WORKER_CPUS:-1}"
          memory: ${NUVA_WORKER_MEMORY:-384m}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: ${NUVA_LOG_MAX_SIZE:-10m}
        max-file: "${NUVA_LOG_MAX_FILE:-5}"
