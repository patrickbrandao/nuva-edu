# PostgreSQL 18 — único armazenamento persistente do nuva-edu.
# Migrations em ./migrations (aplicadas por `pnpm db:migrate`).

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    # Sem root: a entrada da imagem oficial pula o `chown` e a troca de usuário quando já começa
    # como `postgres`, e por isso o contêiner não precisa de capacidade nenhuma. O volume nomeado
    # nasce com o dono certo (copiado de /var/lib/postgresql da imagem).
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuva_edu}
      POSTGRES_USER: ${POSTGRES_USER:-nuva_edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.local}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Nenhuma porta publicada aqui: no desenvolvimento, o `docker-compose.dev.yml` da raiz publica
    # 127.0.0.1:${NUVA_POSTGRES_PORT} (spec 031; `pnpm compose` e `pnpm dev:up` o incluem).
    networks:
      - internal
    read_only: true
    tmpfs:
      # O usuário `postgres` cria /run/postgresql (soquete e trava); o uid muda conforme a
      # imagem (70 na alpine, 999 na debian), então a permissão vai pelo modo, não pelo dono.
      - /run:mode=1777
      - /tmp
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: ${POSTGRES_NOFILE:-65536}
        hard: ${POSTGRES_NOFILE:-65536}
    deploy:
      resources:
        limits:
          cpus: "${NUVA_POSTGRES_CPUS:-1}"
          memory: ${NUVA_POSTGRES_MEMORY:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuva_edu} -d ${POSTGRES_DB:-nuva_edu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${NUVA_LOG_MAX_SIZE:-10m}
        max-file: "${NUVA_LOG_MAX_FILE:-5}"

volumes:
  postgres_data:
    # Nome com o prefixo do projeto (spec 031, "Volumes"). Quem tem o antigo `postgres-data` recebe
    # a cópia pelo `scripts/volume-migrate.sh` (no `pnpm dev:up`; no servidor, só com
    # `pnpm deploy:test --migrate-volume`). O volume antigo é apagado à mão pelo humano.
    name: nuva-edu-postgres-data
