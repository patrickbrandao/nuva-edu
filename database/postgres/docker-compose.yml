# PostgreSQL 18 — único armazenamento persistente do nuva-edu.
# Migrations em ./migrations (aplicadas por `pnpm db:migrate`).

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuva_edu}
      POSTGRES_USER: ${POSTGRES_USER:-nuva_edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.local}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Porta publicada só no próprio host, para migrations e testes locais (verify:quick).
    ports:
      - "127.0.0.1:${NUVA_POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /run
      - /tmp
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    ulimits:
      nofile:
        soft: ${POSTGRES_NOFILE:-8192}
        hard: ${POSTGRES_NOFILE:-8192}
    deploy:
      resources:
        limits:
          cpus: "${NUVA_POSTGRES_CPUS:-1}"
          memory: ${NUVA_POSTGRES_MEMORY:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuva_edu} -d ${POSTGRES_DB:-nuva_edu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${NUVA_LOG_MAX_SIZE:-10m}
        max-file: "${NUVA_LOG_MAX_FILE:-5}"

volumes:
  postgres_data:
    name: postgres-data
