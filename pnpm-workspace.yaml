packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
  - "database/postgres"

# Recusa instalar com Node fora da faixa de "engines".
engineStrict: true

# Dependências autorizadas a rodar scripts de instalação.
allowBuilds:
  lefthook: true
  "@biomejs/biome": true
  # Dependências do Testcontainers: os scripts só compilam aceleração opcional; não rodam.
  cpu-features: false
  protobufjs: false
  ssh2: false
