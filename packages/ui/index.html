<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#070707" />
    <title>Catálogo — @nuva-edu/ui</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (o mesmo conteúdo de THEME_BOOT_SCRIPT).
      try {
        const saved = localStorage.getItem('nuva-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch {
        // armazenamento indisponível: vale o tema do sistema
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/catalog/main.tsx"></script>
  </body>
</html>
