# Exceções do Trivy no fluxo `images` (tarefa 118; como retirar: docs/ci.md, "A exceção
# temporária do Nginx"). Vale SÓ para os jobs dos sites (`admin` e `classroom`): os três de
# backend rodam o Trivy sem arquivo de exceção nenhum.
#
# Regras, conferidas por scripts/ci.test.mjs: toda entrada tem motivo (`statement`), prazo
# (`expired_at`, no máximo 60 dias à frente) e pacote (`purls`). Vencido o prazo, o Trivy deixa
# de aplicar a entrada sozinho e o fluxo volta a barrar; o teste também falha.
vulnerabilities:
  - id: CVE-2026-113425
    purls:
      - pkg:apk/alpine/nginx@1.30.6-r1
    expired_at: 2026-12-24
    statement: >-
      Vulnerabilidade crítica do nginx 1.30.6-r1 que vem fixado na base
      nginxinc/nginx-unprivileged:stable-alpine; corrigida no 1.30.7-r0, ainda sem imagem stable.
      Decisão do usuário em 2026-11-24 (tarefa 118): publicar os sites até a base ser atualizada.
